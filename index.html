ow recognized as a threat to health and mental well-being. Discuss the causes and consequences of noise pollution in modern cities, and suggest solutions to reduce it.","h":[["Opening","In the past, noise was rarely associated with pollution, but today, that noise afflicts daily life in urban areas is a manifest fact."],["Body","Nerve-wracking noise from traffic, construction, and bustling crowds constantly diverts our attention and disturbs our sleep. Over time, people become increasingly fidgety, and researchers have found that long- term noise exposure can lead to serious mental diseases."],["Body","Protecting people from noise pollution is an arduous task, but it can be done. City planners must avoid being short-sighted when developing urban areas. Governments should think twice and implement strict regulations on sound levels to secure tranquil leisure time for citizens."],["Conclusion","In conclusion, reducing noise pollution is essential for creating a healthy living environment and protecting community health."]]},"v":[["Mental disease","Bệnh tâm thần / tổn hại sức khỏe thần kinh"],["Tranquil leisure time","Thời gian rảnh rỗi yên bình, tĩnh lặng"],["Bustling crowd","Đám đông nhộn nhịp / hối hả"],["Nerve-wracking noise","Tiếng ồn nhức óc / căng thẳng thần kinh"],["Be associated with","Gắn liền với / Liên quan đến"],["Afflict daily life","Tác động tiêu cực / Gây phiền hà đến đời sống hàng ngày"],["Divert attention","Làm xao nhãng sự chú ý"],["Disturb sleep","Gián đoạn / Làm ảnh hưởng giấc ngủ"]],"s":["That there is too much noise afflicting our daily life is a manifest fact.","Noise diverts our attention, disturbs our sleep, and destroys our ears.","It is high time that serious consideration was given to noise pollution.","Moreover, measures should be taken to protect people against noise and secure us a quiet environment."]},{"id":18,"t":"Should I live in the countryside or in the city?","lv":"B1","d":"1WVM0z8VBHOpmj3i9TEqk5pTRg9jyQ_xo","a2":{"p":"Do you prefer living in a rural area or an urban area? What do you like about the place you choose?","h":[["Opening","I prefer living in a rural area / an urban area because it suits my lifestyle better."],["Body","On the other hand, living in the city can be noisy, while living in the countryside can be inconvenient."],["Conclusion","In a word, I think my chosen place offers the best living environment for me."]]},"b1":{"p":"Compare the advantages and disadvantages of living in a rural area versus an urban area. What would be your ideal living arrangement to balance work and quality of life?","h":[["Opening","Both living in a rural area and an urban area have advantages and disadvantages, so choosing where to stay is not easy."],["Body","A rural area offers a peaceful environment where people are close to nature, the crime rate is low, and community members often lend a hand. On the other hand, urban areas provide well developed infrastructure, endless choices for leisure and entertainment, and essential services just around the corner."],["Body","Since \"you can't eat the cake and have it,\" we often have to compromise. For me, living in a suburban area and working in the city is the ideal balance between career opportunities and a peaceful home life."],["Conclusion","In a word, a suburban area allows me to enjoy city conveniences while maintaining a relaxed lifestyle close to nature."]]},"v":[["Rural area","Khu vực nông thôn"],["Urban area","Khu vực thành thị"],["Suburban area","Khu vực ngoại thành / ngoại ô"],["Crime rate","Tỷ lệ tội phạm"],["Leisure and entertainment","Giải trí và tiêu khiển"],["Be close to nature","Gần gũi với thiên nhiên"],["Lend a hand","Giúp đỡ, ra tay hỗ trợ"],["Have advantages and disadvantages","Có cả ưu điểm lẫn nhược điểm"]],"s":["Whenever one is in trouble, others will lend a hand.","On the other hand, to live in the cities is not a bad choice either.","City traffic is so well developed that people can go anywhere easily and quickly.","In addition, urban people can enjoy more leisure and entertainment."]},{"id":24,"t":"The Development of American Cities","lv":"B1+","d":"1cUsjMp0CKYc6wpkH7da3x3u43zz2zb4M","a2":{"p":"Do you prefer living in the city center or moving to the suburbs? Why do many young professionals choose to live in big cities?","h":[["Opening","I prefer living in the city center to living in the suburbs because it is more convenient for work and study."],["Body","Many young professionals choose cities because their jobs are there. They want to save time and avoid worrying about fuel shortage when traveling long distances."],["Body","Although cities can be expensive, they offer great opportunities for entertainment. Living here makes people feel part of a mobile class."],["Conclusion","In short, city life fits the energetic lifestyle of young people today."]]},"b1":{"p":"Cities are said to reflect both the best and worst aspects of a society. How have living preferences changed between generations, and why are many people moving back into urban areas?","h":[["Opening","Modern cities reflect the values of the culture, containing both high economic opportunities and challenges like racial conflict or poverty."],["Body","In the past, as families became more prosperous, the ultimate American dream was to move out of city apartments to own a house in the suburbs. However, today's generation has different priorities."],["Body","Nowadays, many young professionals choose to move back into the city. They prefer urban convenience to suburban quietness because of job proximity, exciting lifestyle, and concerns over fuel shortage. This movement has created a wealthier, more mobile class that brings new life to older cities."],["Conclusion","In conclusion, cities will continue to evolve as long as human choices and social values keep shifting."]]},"v":[["Values of the culture","Các giá trị của văn hóa"],["Racial conflict","Xung đột sắc tộc / chủng tộc"],["Young professionals","Giới chuyên gia / Người đi làm trẻ tuổi có trình độ"],["Fuel shortage","Sự thiếu hụt nhiên liệu / xăng dầu"],["Reflect the values of","Phản ánh các giá trị của"],["Move out of / Move back into","/muːv aʊt əv / muːv bæk ˈɪntə/"],["Prefer (A) to (B)","Thích cái gì hơn cái gì"],["Prosperous","Thịnh vượng / Giàu có"]],"s":["They moved out of their apartments in the city to buy their own homes.","They bought houses in the suburbs, areas near the city where people live.","These are areas without many offices or factories.","During the 1950s, the American dream was to have a house in the suburbs."]},{"id":27,"t":"Water resources","lv":"B1+","d":"1axTvtxGS6zYLF6cvut8RJy6-_Tt_7GpC","a2":{"p":"How do you save water in your daily life, and why is it important to protect water resources?","h":[["Opening","Today, many places are faced with the lack of water supply, so saving water is very important."],["Body","In my daily life, I try not to waste water when taking a shower or washing dishes. I also help spread the idea of protecting the environment to my friends and family."],["Body","It is high time for us to reduce our daily water consumption. As long as everyone turns off the tap when not in use, we can save a lot of clean water."],["Conclusion","In short, small actions can make a big difference, and we can overcome difficulty together."]]},"b1":{"p":"Water shortage and water pollution are growing global crises. Discuss the causes of this situation and propose effective solutions using technology and public awareness.","h":[["Opening","Due to population growth, global water consumption has been remarkably raised, leaving many countries faced with a severe lack of clean water supply."],["Body","It is high time for us to take strong measures. On one hand, using high technology allows existing resources to be exploited effectively. On the other hand, governments should advocate the recycling of water in industrial factories to restrain the increase of total consumption."],["Body","Beside technology, educating the public is crucial. Every citizen should participate in spreading the idea of environmental protection and cutting down daily waste."],["Conclusion","In conclusion, as long as governments and individuals cooperate seriously, humanity will successfully overcome this difficulty."]]},"v":[["Water supply","Nguồn cung cấp nước"],["Water consumption","Mức tiêu thụ nước"],["High technology","Công nghệ cao"],["Be faced with","Đối mặt với"],["Exploit effectively","Khai thác hiệu quả"],["Restrain the increase of","Hạn chế / Kiềm chế sự gia tăng"],["Advocate the recycling of","Cổ vũ / Ủng hộ việc tái chế"],["Spread the idea of","Lan tỏa ý tưởng / ý thức"]],"s":["There are two main ways to solve the problem.","Second, measures should be taken to restrain the increase of water consumption.","For example, we can advocate the recycling of water in industry.","As long as we take it seriously, we will definitely overcome this difficulty."]},{"id":38,"t":"Australia","lv":"B1+","d":"1vrPoW-LF80OHKZSFE6rYwXMJlJ5aA98-","a2":{"p":"What makes Australia a unique country, and where do most people live there?","h":[["Opening","Australia is a unique island country that is roughly the size of the US mainland."],["Body","It is not a densely populated country. Most people live in metropolitan areas that line the coast because much of the land inside is too dry."],["Body","Many different ethnic groups make up the population. Many immigrants from around the world have made Australia their home."],["Conclusion","In short, Australia is a beautiful and peaceful country with diverse cultures."]]},"b1":{"p":"Geographical conditions and immigration have shaped modern Australia. Discuss how environment affects where Australians live and how immigrants contribute to its multicultural society.","h":[["Opening","Australia is the driest inhabited continent, and its geography heavily influences how its society is organized."],["Body","Outside of areas with lush green pastures, much of the land remains in an undeveloped state. As a result, Australia is not densely populated overall, and most residents live in metropolitan areas that line the coast."],["Body","Although many citizens are of European descent, various international ethnic groups make up the modern population. Millions of people from Asia and Africa have made Australia their home, enriching the nation's culture and economy."],["Conclusion","In conclusion, the interplay between natural environment and diverse immigration makes Australia a modern and thriving multicultural country."]]},"v":[["Ethnic groups","Các nhóm dân tộc"],["Be of (...) descent","Có nguồn gốc / Gốc gác (từ đâu)"],["Lush green pastures","Những đồng cỏ xanh mướt"],["Metropolitan areas","Các khu vực đô thị / Vùng đô thị"],["Make up (the population)","Cấu thành / Chiếm tỷ lệ (dân số)"],["Make (a place) one's home","Định cư / Chọn làm quê hương"],["Line the coast","Trải dài / Nằm dọc theo bờ biển"],["Roughly the size of","Có kích thước xấp xỉ / Tương đương"]],"s":["That makes this island nation one of the least densely populated countries.","What ethnic groups make up the Australian population?","The majority of Australians are of English, Irish, Italian, Greek, Dutch and Polish descent.","This includes a large number of Asian and African immigrants."]},{"id":43,"t":"Traveling","lv":"B1+","d":"1c1athFBHuD_n3QyJwsgyKGw_qDBFWlmF","a2":{"p":"Why do you like to travel during holidays, and what do you enjoy most about visiting new places?","h":[["Opening","I love to travel with my family from time to time because it helps us relax after work."],["Body","Visiting new places is great to broaden my scope of knowledge. I can try local food and learn about alien customs that I didn't know before."],["Body","Even though weather can be bad sometimes, traveling does more good than harm. Seeing an exotic atmosphere makes me feel excited."],["Conclusion","In short, if you have time and money, you might as well go on a trip to enjoy life."]]},"b1":{"p":"Traveling brings many benefits, but it also presents certain risks and challenges. Discuss the pros and cons of traveling and explain why you agree or disagree that 'traveling does more good than harm'.","h":[["Opening","Nowadays, when basic necessities of life are fully met, people prefer spending extra money on trips. On the whole, I believe traveling does more good than harm."],["Body","On the positive side, traveling allows individuals to broaden their scope of knowledge and immerse themselves in an exotic atmosphere with alien customs. However, adventure trips involving perilous peaks and furious rapids can sometimes endanger travelers' lives if safety measures are ignored."],["Body","Despite bad weather or difficult accommodations, facing these obstacles helps travelers build up physical strength and willpower. Therefore, these challenges are valuable life lessons rather than pure drawbacks."],["Conclusion","In conclusion, as long as health and finance permit, everyone might as well travel from time to time to enrich their perspective on the world. 44. Hobbies. A hobby can be almost anything a person likes to do in his spare time. They watch birds, hunt animals, climb mountains, raise flowers, fish, ski, skate, and swim. They paint pictures, go to concerts, collect everything from books to butterflies, and from shells to stamps. People take up hobbies because these activities offer enjoyment, friendship, knowledge, and relaxation. Anyone, rich or poor, old or young, sick or well, can follow a satisfying hobby. Besides, hobbies can help a person's mental and physical health. Doctors have found that hobbies are valuable in helping patients recover from physical or mental illness. In early times, most people were too busy making a living to have many hobbies. But some persons did enjoy hobbies. The ancient Egyptians played games with balls made of wood, and some Greeks and Romans collected things. People today have more time than ever before for hobbies. Machines and automation have reduced the amount of time they must spend on their jobs. Once a famous Canadian doctor expressed the value of hobbies by saying “so let's take up a hobby and be really a happy man!” A. TARGET VOCABULARY 1. Danh từ & Cụm danh từ (Nouns & Noun Phrases) ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------- STT Từ / Cụm từ Phiên âm (IPA) Nghĩa tiếng Việt Ví dụ trong bài ----- ---------------------------- ------------------------------- -------------------------------- ------------------------------------------------------------------------ 1 Spare time /speə(r) taɪm/ Thời gian rảnh rỗi A hobby can be almost anything a person likes to do in his spare time. 2 Mental and physical health /ˈmentl ænd ˈfɪzɪkl helθ/ Sức khỏe tinh thần và thể chất ...hobbies can help a person's mental and physical health. 3 Physical or mental illness /ˈfɪzɪkl ɔː(r) ˈmentl ˈɪlnəs/ Bệnh tật thể chất hoặc tâm lý ...helping patients recover from physical or mental illness. ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------- 2. Động từ & Cụm động từ (Verbs & Verb Phrases) ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ STT Từ / Cụm từ Phiên âm (IPA) Nghĩa tiếng Việt Ví dụ trong bài ----- -------------------------------- ----------------------------------------- --------------------------------------------- ----------------------------------------------------------------------------- 4 Take up (a hobby) /teɪk ʌp/ Bắt đầu theo đuổi (một sở thích) People take up hobbies because these activities offer enjoyment... 5 Offer enjoyment and relaxation /ˈɒfə(r) ɪnˈdʒɔɪmənt ænd ˌriːlækˈseɪʃn/ Mang lại niềm vui và sự thư giãn ...these activities offer enjoyment, friendship, knowledge, and relaxation. 6 Follow a satisfying hobby /ˈfɒləʊ ə ˈsætɪsfaɪɪŋ ˈhɒbi/ Theo đuổi một sở thích yêu thích / thỏa mãn Anyone... can follow a satisfying hobby. 7 Recover from /rɪˈkʌvə(r) frəm/ Hồi phục / Phục hồi khỏi ...helping patients recover from physical or mental illness. 8 Make a living /meɪk ə ˈlɪvɪŋ/ Kiếm sống / Trang trải cuộc sống ...most people were too busy making a living to have many hobbies. ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ 3. Tính từ, Cụm từ & Cấu trúc khác (Adjectives, Phrases & Structures) ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- STT Từ / Cụm từ Phiên âm (IPA) Nghĩa tiếng Việt Ví dụ trong bài ----- ---------------------------- ------------------------------- ------------------------------------------- ---------------------------------------------------------------------------- 9 Be valuable in (doing sth) /bi ˈvæljuəbl ɪn/ Có giá trị / Rất có ích trong việc làm gì ...hobbies are valuable in helping patients recover... 10 In early times /ɪn ˈɜːli taɪmz/ Thời xa xưa / Thời kỳ đầu In early times, most people were too busy making a living... 11 Reduce the amount of time /rɪˈdjuːs ðə əˈmaʊnt əv taɪm/ Giảm bớt lượng thời gian Machines... have reduced the amount of time they must spend on their jobs. ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- B. SPEAKING PROMPTS & HINTS 1. Đề bài dành cho trình độ A2 (Cơ bản - Sở thích Cá nhân & Lợi ích Sức khỏe) Đề bài (Prompt): \"What is your favorite hobby in your spare time, and why do you think having a hobby is good for your health?\" (Sở thích yêu thích của bạn trong thời gian rảnh là gì, và tại sao bạn nghĩ rằng có một sở thích lại tốt cho sức khỏe?) Gợi ý cấu trúc bài nói (Speaking Hints):"],["Opening","In my spare time, I decided to take up reading books because it makes me happy."],["Body","Doing this activity helps offer enjoyment and relaxation after long study hours. Anyone can follow a satisfying hobby that fits their life."],["Body","Having a hobby improves both mental and physical health and helps us forget daily stress."],["Conclusion","In short, everyone should have at least one hobby to live a happier life."]]},"v":[["Necessities of life","Nhu cầu thiết yếu của cuộc sống"],["Alien customs","Phong tục tập quán lạ / Ngoại quốc"],["Perilous peaks and furious rapids","Những đỉnh núi hiểm trở và dòng thác dữ"],["Exotic atmosphere","Bầu không khí độc đáo / Kỳ lạ / Phương xa"],["Broaden one's scope of knowledge","Mở rộng tầm hiểu biết / Tri thức"],["Endanger sb's life","Gây nguy hiểm cho tính mạng của ai"],["Do more good than harm","Có lợi nhiều hơn có hại"],["Build up physical strength and willpower","Rèn luyện thể lực và ý chí"]],"s":["However, traveling also has some disadvantages.","For example, perilous peaks and furious rapids may endanger travelers' lives.","Accommodations and bad weather trouble travelers a lot.","On the whole, I think traveling does more good than harm."]}]},{"id":"mystery","name":"Mystery Casino","icon":"🎲","desc":"Strange facts and big stories","tracks":[{"id":5,"t":"Insurance","lv":"B1+","d":"1RBxSRhSlHRN71LtyRgAL24w02367EBAN","a2":{"p":"Talk about the bad things that can happen in life and how people protect themselves. Do you or your family have any insurance?","h":[["Opening","In my opinion, life is full of dangers and surprises."],["Body","For example, your house may burn down, you may have a crash when driving, or you may fall and break your neck. We cannot always prevent disasters."],["Body","But we can insure against them. People can take out a policy. Some insurance is voluntary, and some is compulsory."],["Conclusion","In my family, my parents pay for national insurance to get sickness benefits or old age pensions."]]},"b1":{"p":"Some forms of insurance are voluntary, but others are compulsory. Discuss the differences between them and explain why compulsory insurance (like car insurance or national insurance) is important for society.","h":[["Opening","We all know that life is full of dangers and surprises, and we cannot always prevent disasters. Therefore, we need to insure against them. There are two main types: voluntary and compulsory."],["Body","Some forms of insurance are compulsory. For example, every driver must take out a third-party insurance policy. If you have a crash, this policy doesn't cover your own car, but its aim is to protect road users from each other."],["Body","However, if you want to protect your own car against fire, theft and other terrible things, it is up to you to buy a comprehensive policy. This is voluntary."],["Body","Another important compulsory insurance is national insurance. People who earn money on a regular basis must pay a sum to the state. These weekly contributions are very useful because they cover the cost of social services like unemployment benefit, sickness benefit, and old age pensions."],["Conclusion","In conclusion, although we have to pay money, insurance is the best way to prepare for the future because anything may happen."]]},"v":[["Disaster","Thảm họa, tai ương"],["Third-party insurance","Bảo hiểm bên thứ ba (trách nhiệm dân sự)"],["Comprehensive policy","Gói bảo hiểm toàn diện (hai chiều)"],["National insurance","Bảo hiểm quốc gia"],["Contribution","Khoản đóng góp, tiền đóng"],["Benefit","Phúc lợi, trợ cấp"],["Unemployment benefit","Trợ cấp thất nghiệp"],["Sickness benefit","Trợ cấp ốm đau"]],"s":["Most forms of insurance are voluntary.","It is up to you whether you insure or not.","That means you have to insure.","For example, a driver must take out a third-party insurance policy."]},{"id":13,"t":"The mystery of color","lv":"A2","d":"1Vm76T5wClEwpP-x91oOVeeMElcNgu3j2","a2":{"p":"What is your favorite color? Do you prefer warm colors or cool colors? How do these colors make you feel?","h":[["Opening","In general, I love colors. My favorite color is blue/red, so I prefer cool colors / warm colors."],["Body","I am a sociable person, so I like warm colors like red and yellow because they make me feel active. / I like to spend time alone, so cool colors are very relaxing for me."],["Body","Cool colors like blue remind me of cool days or clear winter sunlight, while warm colors remind me of hot summer days."],["Conclusion","That is why I always choose clothes or room decorations in my favorite colors."]]},"b1":{"p":"Do you think a person's color preference reflects their personality and mood? Discuss how warm and cool colors affect human emotions and behavior.","h":[["Opening","In general, colors play an important role in our daily lives. Researchers suggest that the colors we prefer can reflect our personality and directly influence our feelings."],["Body","Warm colors such as red, orange, and yellow tend to make people feel energetic and active. Sociable people often enjoy these vibrant shades because they appear bright and welcoming, reminding them of sunny summer days."],["Body","Unlike warm colors, cool colors like blue, green, and violet have a relaxing effect. Environment decorated with cool shades usually encourages quietness, which is ideal for those who like to spend time alone to focus or unwind."],["Conclusion","In conclusion, whether through nature or personal choice, colors deeply impact our emotional state and can reveal a lot about who we are."]]},"v":[["Warm colors","Gam màu nóng (đỏ, cam, vàng)"],["Cool colors","Gam màu lạnh (xanh lá, xanh dương, tím)"],["Sociable people","Những người cởi mở, hòa đồng"],["Sunlight","Ánh sáng mặt trời, ánh nắng"],["Violet","Màu tím (màu hoa violet)"],["Prefer","Thích hơn, ưu tiên chọn"],["Spend time alone","Dành thời gian ở một mình"],["Remind (sb) of (st)","Gợi nhớ cho (ai) về (cái gì)"]],"s":["Sociable people, those who like to be with others, like red.","The cool colors are green, blue, and violet.","These colors, unlike warm colors, are relaxing.","Where there are cool colors, people are usually quiet."]},{"id":31,"t":"The Great Titanic","lv":"B1","d":"192F4QWr90-5E4I7lYfy7T-OVY9LUcU7X","a2":{"p":"Why is the story of the Titanic famous around the world, and what should people prepare for a safe journey?","h":[["Opening","The story of the Titanic is famous because of its tragic sinking on its first trip, which caused a heavy loss of life."],["Body","Even though the Titanic was regarded as unsinkable with 16 watertight compartments, it could not avoid a direct collision with an iceberg after setting out."],["Body","When the ship was damaged, people had to abandon the ship and plunge into the cold water. Today, to travel safely, we must always prepare enough lifeboats and follow safety equipment instructions."],["Conclusion","In short, remembering this story helps us value safety regulations much more today."]]},"b1":{"p":"People believed the Titanic was unsinkable, yet its first voyage ended in a tragic disaster. What lessons can we learn from the sinking of the Titanic regarding human overconfidence in technology and safety rules?","h":[["Opening","Even by modern standards, the Titanic was a massive ship, but overconfidence in technology led to one of history's most tragic sinkings."],["Body","Shortly after setting out, the liner was regarded as completely safe due to its advanced watertight compartments. However, when it failed to avoid a direct collision with a huge iceberg, even narrowly missing the main wall was not enough to save it."],["Body","The captain realized to his horror that five compartments were flooded. When the crew ordered passengers to abandon the ship, hundreds plunged into icy waters, resulting in a heavy loss of life because there were not enough lifeboats. This shows that technology cannot replace careful planning and adequate emergency prep."],["Conclusion","In conclusion, the tragedy of the Titanic remains a powerful reminder that human confidence must always go hand in hand with strict safety standards."]]},"v":[["Watertight compartments","Các khoang kín nước / chống tràn"],["Tragic sinking","Vụ đắm tàu thảm khốc / đau thương"],["Heavy loss of life","Thảm họa thiệt mạng lớn / tổn thất lớn về người"],["Direct collision","Cú va chạm trực diện"],["Be regarded as","Được xem là / được coi là"],["Set out","Khởi hành / Bắt đầu hành trình"],["Narrowly miss","Suýt soát chệch / Sút trúng"],["Abandon the ship","Rời bỏ tàu (khi sắp đắm)"]],"s":["Even by modern standards, the 46,000 ton Titanic was a colossal ship.","Even if two of these were flooded, she would still be able to float.","After the alarm had been given, the great ship turned sharply to avoid a direct collision.","The noise had been so faint that no one thought that the ship had been damaged."]},{"id":34,"t":"The Art of Shaking Hands","lv":"B1+","d":"1da25txP48uEb0E9R8v3vQ-t07cQxwaQp","a2":{"p":"How do people greet each other in your country, and why is shaking hands or bowing a good way to show respect?","h":[["Opening","In my country, greeting people is perfectly natural when we meet friends or new people."],["Body","Shaking hands is an action many people do without thinking. When we hold out our hand, we indicate friendship and represent goodwill to others."],["Body","Bowing or shaking hands is a polite way to pay respect to older people or superiors. This habit has been handed down from our ancestors and is full of meaning."],["Conclusion","In short, simple body gestures make social communication polite and warm."]]},"b1":{"p":"Many daily gestures like shaking hands have deep historical origins. Why is it important to carry on traditional customs, and how do gestures represent goodwill in different cultures?","h":[["Opening","Although shaking hands feels perfectly natural today, it is a practice full of meaning that has developed down through the ages."],["Body","In ancient history, the hand was a symbol of power and strength. Extending an open hand was used to indicate friendship and represent goodwill by showing one was not armed. In many societies, people developed specific gestures to pay respect to leaders without accepting a mark of inferiority."],["Body","Modern society should carry on a custom that has been handed down from ancient times. Even when some people resist the efforts of following old habits, understanding why we perform actions that we usually do without thinking helps preserve cultural connection."],["Conclusion","In conclusion, understanding the history behind simple gestures enriches our daily communication and preserves shared human values."]]},"v":[["Symbol of power and strength","Biểu tượng của quyền lực và sức mạnh"],["Mark of inferiority","Dấu hiệu của sự yếu thế / thấp kém"],["Down through the ages","Trải qua nhiều thế hệ / Qua nhiều thời đại"],["Do without thinking","Làm mà không cần suy nghĩ (theo phản xạ)"],["Represent goodwill","Thể hiện / Đại diện cho thiện chí"],["Pay respect to","Tỏ lòng tôn kính / Bày tỏ sự tôn trọng"],["Resist the efforts of","Khước từ / Chống lại nỗ lực của"],["Indicate friendship","Bày tỏ / Thể hiện tình bạn"]],"s":["The hand was used to fight enemies, kill animals, and make spears and implements.","The Greeks prayed to their gods with raised hands.","Among the Arabs, it was customary at one time to kiss the hand of a superior."]},{"id":36,"t":"Human Nose","lv":"B1+","d":"1tIml4ybi-4QkIlPq6O-LbZaFaL1YNCrl","a2":{"p":"How do body idioms help us express feelings, and why should we follow our instinct when making decisions?","h":[["Opening","The nose is not just an organ for breathing and smelling; it also gives a person special character and inspires many idioms."],["Body","In English, we shouldn't hold up our nose at others when we feel proud. Also, nobody wants to be led around by the nose by someone else."],["Body","Instead of letting others control us, it is better to follow one's nose and trust our instinct. It is as plain as the nose on your face that making our own choices makes us more independent."],["Conclusion","In short, learning body idioms helps us speak English more naturally and express feelings clearly."]]},"b1":{"p":"Idioms involving body parts often reflect human weaknesses such as pride, jealousy, and control. Discuss how understanding these expressions helps us recognize emotional reactions and build better self-awareness.","h":[["Opening","Human body parts play a principal role in everyday language, especially through expressions concerning the nose that describe common human weakness."],["Body","When people display arrogance, they often hold up their nose at those around them. On the other hand, if someone is ignored or turned aside because of a competitor, they easily have their nose put out of joint due to hurt pride. Moreover, weak individuals often allow themselves to be led around by the nose instead of taking responsibility."],["Body","To overcome these negative emotions, one should learn to follow one's nose by trusting inner judgment rather than external pressure. It is as plain as the nose on your face that emotional intelligence enables us to handle conflict maturely."],["Conclusion","In conclusion, mastering idioms dealing with body parts enriches our vocabulary and deepens our understanding of human behavior."]]},"v":[["Principal role","Vai trò chính / Vai trò chủ đạo"],["Human weakness","Điểm yếu / Nhược điểm của con người"],["Organ for breathing and smelling","Cơ quan dùng để thở và ngửi"],["Give a person special character","Tạo nên nét đặc trưng / Cá tính riêng"],["Hold up one's nose (at sb/sth)","/həʊld ʌp wʌnz nəʊz/"],["Be led around by the nose","Bị dắt mũi / Bị chi phối hoàn toàn"],["Follow one's nose","Đi theo bản năng / Đi thẳng tới"],["Have one's nose put out of joint","Bị phật ý / Cảm thấy bị ra rìa, tự ái"]],"s":["Historically, man's nose has had a principal role in his imagination.","Man has referred to the nose in many ways to express his emotions.","Expressions concerning the nose refer to human weakness: anger, pride, jealousy, and revenge.","In English, there are a number of phrases about the nose."]},{"id":37,"t":"The International Red Cross","lv":"B1+","d":"1vTyvivbw89qfmvVLVA5aehZYEE7gjiUU","a2":{"p":"Why is the Red Cross an important organization, and how can people in your community help those in need?","h":[["Opening","The Red Cross is famous around the globe because it always cares for people in need."],["Body","Millions of people who suffer from disasters are aided by this organization. It was set up to provide a number of services such as donating blood and teaching first aid."],["Body","In my city, we can share a common goal to help others. We can donate clothes or food to victims of natural disasters, regardless of where they live."],["Conclusion","In short, helping others makes our society better and kinder."]]},"b1":{"p":"Humanitarian aid organizations provide support to everyone without discrimination. Discuss the importance of neutral humanitarian assistance during crises and how young people can participate in volunteer work.","h":[["Opening","Organizations working around the globe share a common goal of protecting human life and health during emergencies."],["Body","Since the Red Cross was set up, its core principle has been to treat the sick and wounded or prisoners of war regardless of their political background or nationality. Victims of earthquakes and wars are aided by neutral volunteers who strictly care for people in need."],["Body","Today, these institutions provide a number of services for the public, including training in first aid and emergency response. Young people can contribute by participating in local charity drives, donating blood, or raising public awareness."],["Conclusion","In conclusion, universal compassion is vital for global solidarity, and youth involvement ensures these humanitarian values endure."]]},"v":[["People in need","Những người gặp hoàn cảnh khó khăn / cần trợ giúp"],["Sick and wounded","Người ốm đau và người bị thương"],["Prisoners of war","Tù binh chiến tranh"],["First aid","Sơ cứu ban đầu"],["Care for","Chăm sóc / Quan tâm đến"],["Be aided by","Được giúp đỡ / hỗ trợ bởi"],["Share a common goal","Có chung một mục tiêu"],["Set up","Thành lập / Tác tạo"]],"s":["In 1859, he observed how people were suffering on a battlefield in Italy.","He wanted to help all the wounded people regardless of which side they were fighting for.","The most important result of his work was an international treaty called the Geneva Convention.","It protects prisoners of war, the sick and wounded, and other citizens during a war."]}]}];

 const pos=[];for(let c=1;c<=8;c++)pos.push([1,c]);for(let rw=2;rw<=5;rw++)pos.push([rw,8]);for(let c=8;c>=1;c--)pos.push([6,c]);for(let rw=5;rw>=2;rw--)pos.push([rw,1]);
 const left=G.round,tm=Math.max(0,S.n*60-(Date.now()-G.t0)/1000);
 $('#app').innerHTML=`<div class="top"><div class="stat">👤 ${S.name} · ${G.level}</div><div class="stat gold">🪙 <span id="gc">${G.gc}</span> GC</div><div class="stat">📍 ${String(G.pos+1).padStart(2,'0')} / 24</div><div class="stat">${S.mode=='rounds'?`Round ${G.round}/${S.n}`:S.mode=='time'?`⏱ <span id="clk"></span>`:`Lap ${G.lap?'done':'1'}`}</div><button class="host" id="hostb">⚙ Host panel</button></div>
 <div class="board">${pos.map((p,i)=>`<div class="tile t${LAYOUT[i]} ${i==G.pos?'cur':''}" style="grid-row:${p[0]};grid-column:${p[1]}"><small>${i+1}</small><b>${KIND[LAYOUT[i]][1]}</b>${KIND[LAYOUT[i]][0]}${i==G.pos?'<span class="pawn">♟️</span>':''}</div>`).join('')}
 <div class="center"><div class="mut">${G.w.icon} ${G.w.name}</div><div class="dice" id="dice">${pips(G.dv||1)}</div><button class="pl btn-l" id="roll">🎲 ROLL!</button><div class="buffs">${Object.keys(G.buf).filter(k=>G.buf[k]).map(k=>`<span>${k}</span>`).join('')}</div><div class="log">${G.log.join('<br>')}</div></div></div>`;
 $('#roll').onclick=roll;$('#hostb').onclick=hostPanel;
 if(S.mode=='time'){clearInterval(G.iv);const u=()=>{const s=Math.max(0,S.n*60-(Date.now()-G.t0)/1000);const e=$('#clk');if(e)e.textContent=Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};u();G.iv=setInterval(u,1000)}
}
function closeM(){$('#mod').innerHTML=''}
function modal(h,cls=''){$('#mod').innerHTML=`<div class="ov"><div class="modal ${cls}">${h}</div></div>`}
function gain(n){G.gc+=n;const g=$('#gc');if(g)g.textContent=G.gc;for(let i=0;i<Math.min(8,Math.ceil(n/3));i++){const c=document.createElement('div');c.className='coin';c.textContent='🪙';c.style.left=(innerWidth/2+rnd(80)-40)+'px';c.style.top=(innerHeight/2)+'px';c.style.setProperty('--x',(innerWidth/2-60)+'px');c.style.setProperty('--y',-innerHeight/2+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),1000)}}
const finished=()=>S.mode=='rounds'?G.round>=S.n:S.mode=='time'?(Date.now()-G.t0)/1000>=S.n*60:G.lap>0;
async function roll(){
 if(G.busy)return;G.busy=true;const d=$('#dice');$('#roll').disabled=true;d.classList.add('roll');
 for(let i=0;i<9;i++){d.innerHTML=pips(1+rnd(6));await sleep(90)}
 const v=1+rnd(6);G.dv=v;d.classList.remove('roll');d.innerHTML=pips(v);await sleep(300);
 for(let i=0;i<v;i++){G.pos=(G.pos+1)%24;if(G.pos==0)G.lap++;board();G.dv=v;await sleep(220)}
 G.busy=false;G.round++;addLog(`Rolled ${v} → ${KIND[LAYOUT[G.pos]][0]}`);tile()
}
function tile(){
 const k=LAYOUT[G.pos];
 if(k=='T'){gain(10);addLog('Treasure +10 GC');modal(`<h2 class="gold">🪙 TREASURE!</h2><p class="prompt">You found 10 Gold Coins.</p><div class="row"><button class="pl" id="nx">Continue</button></div>`);return $('#nx').onclick=after}
 if(k=='J')return wheel();
 if(k=='M')return mystery();
 task(k)
}
function after(){closeM();if(finished()){board();return setTimeout(end,300)}board()}
function mystery(){
 const e=pick(EVENTS);addLog('Mystery: '+e[0]);
 modal(`<h2 class="neon">🎁 ${e[0]}</h2><p class="prompt">${e[1]}</p><div class="row"><button class="pl" id="nx">OK</button></div>`);
 $('#nx').onclick=()=>{const t=e[2];
  if(t=='coin'){gain(e[3]);after()}
  else if(t=='free'){G.round--;after()}
  else if(['dbl','swap','time','wiz','shield','again'].includes(t)){G.buf[t]=true;after()}
  else if(t=='hunt'){const n=5+5*rnd(5);gain(n);addLog('Found '+n+' GC');after()}
  else if(t=='secret'||t=='gold')task('S',{reward:t=='secret'?25:20,label:e[0]});}
}
function wheel(){
 const seg=[['+10 GC',()=>gain(10)],['+20 GC',()=>gain(20)],['+5 GC',()=>gain(5)],['JACKPOT +30 GC',()=>{gain(30);document.body.classList.add('jp');setTimeout(()=>document.body.classList.remove('jp'),3000)}],['Free Roll',()=>G.round--],['+15 GC',()=>gain(15)]];
 const win=[1,3,0,2,4,5];/* index mapping to colour order */
 modal(`<h2 class="gold">🎰 LUCKY WHEEL</h2><p class="mut" style="text-align:center">Every spin wins something. Student: spin it!</p><div class="wheel" id="wh"></div><div class="row" style="justify-content:center"><button class="pl btn-l" id="sp">SPIN</button></div><p class="prompt" id="wr" style="text-align:center"></p>`);
 $('#sp').onclick=()=>{$('#sp').disabled=true;const i=rnd(6);$('#wh').style.transform=`rotate(${360*5+(360-(i*60+30))}deg)`;
  setTimeout(()=>{seg[i][1]();addLog('Wheel: '+seg[i][0]);$('#wr').innerHTML=`<span class="gold">${seg[i][0]}</span>`;$('#sp').outerHTML='<button class="pl" id="nx">Continue</button>';$('#nx').onclick=after},3100)}
}
function mkTask(k,o){
 const t=nextTrack(),lv=G.level,lvk=lv=='B1'?'b1':'a2',x=t[lvk],hard=t.b1;
 const base={tr:t,kind:k,hints:[],words:[]};
 if(k=='Q'||k=='S')return{...base,title:k=='S'?o.label:'Question',prompt:x.p,hints:x.h,hard:hard.p,hardH:hard.h,easy:`Say 2 or 3 sentences about “${t.t}”.`,words:t.v.slice(0,4)};
 if(k=='D')return{...base,title:'Describe',prompt:`Talk about “${t.t}”. Use at least 3 of the words below.`,hints:x.h.slice(0,2),hard:hard.p,hardH:[],easy:`Say one sentence with each of the words below.`,words:shuf(t.v).slice(0,5)};
 const s=t.s.slice(0,lv=='B1'?2:1).join(' ');
 return{...base,title:'Challenge',prompt:`Shadow & retell: read this aloud clearly, then say it again in your own words.`,quote:s,hints:[],hard:hard.p,hardH:[],easy:`Read it aloud twice. Slowly, then smoothly.`,words:t.v.slice(0,3)}
}
function task(k,o={}){
 let T=mkTask(k,o);G.cur=T;
 const front=()=>{const swap=G.buf.swap?`<button id="swp">🔄 Swap</button>`:'';
  modal(`<span class="chip">${KIND[k]?KIND[k][1]+' '+KIND[k][0]:'⭐ '+T.title}</span><span class="chip">${T.tr.t}</span><p class="prompt">${T.prompt}</p>${T.quote?`<div class="hint">“${T.quote}”</div>`:''}
  ${k=='S'?`<p class="mut">Bonus mission · reward ${o.reward} GC (no bet needed)</p><div class="row"><button class="pl" id="go">🎤 Start speaking</button>${swap}</div>`:`<h3 style="margin:14px 0 8px">CHOOSE YOUR BET</h3><div class="bets"><button class="pl" data-b="0"><small>SAFE</small><b>5</b>GC · Easy</button><button class="pl" data-b="1"><small>RISKY</small><b>15</b>GC · Medium</button><button class="pl" data-b="2"><small>JACKPOT</small><b>30</b>GC · Hard</button></div><p class="mut" style="font-size:.8rem">Rewards for completing. Not finishing still earns 2 / 3 / 5 GC. You never lose coins.</p><div class="row">${swap}</div>`}`);
  $('#swp')&&($('#swp').onclick=()=>{G.buf.swap=false;T=mkTask(k,o);G.cur=T;front()});
  $('#go')&&($('#go').onclick=()=>speak(T,{lvl:2,reward:o.reward||25,fixed:1,hard:1}));
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>speak(T,{lvl:+b.dataset.b,reward:[5,15,30][b.dataset.b]}))};
 front();
}
function speak(T,B){
 let prompt=T.prompt,hints=T.hints,words=T.words,time=[60,45,60][B.lvl];
 if(!T.quote){if(B.lvl==0){prompt=T.easy;hints=[];time=60}if(B.lvl==2){prompt=T.hard;hints=[];words=T.tr.v.slice(0,3);time=75}}
 else time=[60,45,45][B.lvl];
 if(B.hard){prompt=T.hard;hints=[];time=75}
 if(G.buf.time){time+=30;G.buf.time=false}
 const wiz=G.buf.wiz;G.buf.wiz=false;let hi=wiz?hints.length:0,tl=time,run=0,iv,sh=wiz;
 const rd=()=>{
  const lo=tl<=10?'low':'';
  $('#mod').firstChild.firstChild.innerHTML=`<span class="chip">${T.tr.t}</span><span class="chip">${B.fixed?'Bonus':['SAFE','RISKY','JACKPOT'][B.lvl]} bet</span><p class="prompt">${prompt}</p>${T.quote?`<div class="hint">“${T.quote}”</div>`:''}
  <div>${(sh?words:[]).map(w=>`<span class="chip">${w[0]}${B.lvl==2?'':' · '+w[1]}</span>`).join('')}</div>${hints.slice(0,hi).map(h=>`<div class="hint"><b class="neon">${h[0]}:</b> ${h[1]}</div>`).join('')}
  <div class="timer ${lo}">${Math.floor(tl/60)}:${String(tl%60).padStart(2,'0')}</div>
  <div class="row"><button class="pl" id="tm">${run?'⏸ Pause':'⏱ Start timer'}</button><button class="pl" id="hv">💡 REVEAL HINT</button><button class="host" id="jd">⚖ TEACHER JUDGE</button></div>`;
  $('#tm').onclick=()=>{run=!run;clearInterval(iv);if(run)iv=setInterval(()=>{if(--tl<=0){tl=0;run=0;clearInterval(iv)}rd()},1000);rd()};
  $('#hv').onclick=()=>{if(!sh){sh=true}else if(hi<hints.length)hi++;rd()};
  $('#jd').onclick=()=>{clearInterval(iv);judge(T,B)}};
 modal('');rd()
}
function judge(T,B){
 const c={};
 modal(`<h3 class="gold">⚖ Teacher Judge</h3><p class="mut">Rate the answer. Optionally mark strengths ✓ and areas to work on ✗.</p>
 <div class="crit">${CRIT.map(k=>`<span>${k}</span><button class="s" data-c="${k}" data-v="s">✓</button><button class="w" data-c="${k}" data-v="w">✗</button>`).join('')}</div>
 <div class="row"><button class="host" data-r="2">⭐ Excellent</button><button class="host" data-r="1">👍 Good</button><button class="host" data-r="0">💪 Keep Trying</button></div>
 <p class="mut" style="font-size:.8rem">Bonus: Excellent +2 GC. Host can also adjust coins from the Host panel.</p>`,'hostm');
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c,v=b.dataset.v;c[k]=c[k]==v?null:v;b.style.outline=c[k]==v?'2px solid #fff':'none'});
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
  const r=+b.dataset.r;
  for(const k in c){if(c[k])G.crit[k]=(G.crit[k]||[0,0]),G.crit[k][c[k]=='s'?0:1]++}
  if(r==0&&(G.buf.shield||G.buf.again)){G.buf.shield?G.buf.shield=false:G.buf.again=false;return modal(`<h2 class="neon">🛡 Free retry!</h2><p class="prompt">Your Lucky Shield / Speak Again token gives you another go.</p><div class="row"><button class="pl" id="rt">Speak again</button></div>`),$('#rt').onclick=()=>speak(T,B)}
  G.tasks++;let amt;
  if(r>0){G.ok++;G.done[T.tr.id]=1;ST.done[T.tr.id]=1;amt=B.reward+(r==2?2:0);if(G.buf.dbl){amt*=2;G.buf.dbl=false}}
  else amt=B.fixed?5:[2,3,5][B.lvl];
  gain(amt);addLog(`${r?'Completed':'Tried'}: +${amt} GC`);
  if(r>0&&G.gc>=5&&!B.fixed)return don(amt);
  modal(`<h2 class="gold">${r?'🏆 NICE!':'Good effort!'}</h2><p class="prompt">+${amt} GC</p><div class="row"><button class="pl" id="nx">Continue</button></div>`);$('#nx').onclick=after})
}
function don(amt){
 modal(`<h3 class="gold">+${amt} GC earned!</h3><p>Optional: <b>DOUBLE OR NOTHING</b>. Spin for x0 (30%), x1 (40%) or x2 (30%) of the coins you wager. Odds are always shown.</p><div class="row">${[5,10].filter(w=>w<=G.gc).map(w=>`<button class="pl" data-w="${w}">Wager ${w} GC</button>`).join('')}<button id="nx">No thanks</button></div><p class="prompt" id="dr"></p>`);
 $('#nx').onclick=after;
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const w=+b.dataset.w,x=Math.random(),m=x<.3?0:x<.7?1:2;gain(w*(m-1));addLog(`Double or Nothing x${m}`);document.querySelectorAll('[data-w]').forEach(q=>q.remove());$('#dr').innerHTML=`Result: <span class="gold">x${m}</span> → ${m==0?'wager returned to 0 (no penalty to your earned task rewards beyond the wager)':m==1?'you keep your coins':'+'+w+' GC!'}`;$('#nx').textContent='Continue'})
}
function hostPanel(){
 modal(`<h3 class="gold">Host panel</h3><p class="mut">Change level anytime</p><div class="seg" id="lv">${['A2','B1'].map(l=>`<button class="${G.level==l?'on':''}" data-l="${l}">${l}</button>`).join('')}</div>
 <p class="mut">Adjust coins</p><div class="row"><button class="host" data-a="-5">-5</button><button class="host" data-a="5">+5</button><button class="host" data-a="10">+10</button></div>
 <div class="row"><button class="pl" id="cl">Resume</button><button class="host" id="en">End game now</button></div>`,'hostm');
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{G.level=b.dataset.l;hostPanel()});
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{G.gc=Math.max(0,G.gc+ +b.dataset.a);closeM();board()});
 $('#cl').onclick=()=>{closeM();board()};$('#en').onclick=()=>{closeM();end()}
}
function end(){
 clearInterval(G.iv);closeM();
 const rate=G.tasks?Math.round(100*G.ok/G.tasks):0,st=[],wk=[];
 CRIT.forEach(k=>{const v=G.crit[k];if(v){if(v[0]>=v[1])st.push(k);else wk.push(k)}});
 const min=Math.round((Date.now()-G.t0)/60000);
 $('#app').innerHTML=`<h1 class="title">🏆 RESULTS</h1><p class="sub">${S.name} · ${G.w.name} · ${G.level}</p>
 <div class="grid g3" style="margin:16px 0"><div class="card"><div class="mut">Total Gold Coins</div><div class="big gold" style="font-size:2.4rem">${G.gc}</div></div><div class="card"><div class="mut">Tasks completed</div><div class="big neon" style="font-size:2.4rem">${G.ok}/${G.tasks}</div></div><div class="card"><div class="mut">Completion rate · time</div><div class="big" style="font-size:2.4rem">${rate}% · ${min}m</div></div></div>
 <div class="card"><p><b class="gold">Strengths:</b> ${st.join(', ')||'—'}</p><p><b class="neon">To improve:</b> ${wk.join(', ')||'—'}</p><label class="mut">Teacher comment</label><textarea id="nt" rows="3" placeholder="Short feedback for the student…"></textarea></div>
 <div class="row" style="justify-content:center;margin:18px 0"><button class="host btn-l" id="sv">Save &amp; play again</button><button class="pl btn-l" id="sw">Save &amp; choose another World</button></div>`;
 const fin=()=>{const r={ts:Date.now(),date:new Date().toLocaleString('en-GB'),name:S.name,world:G.w.name,level:G.level,mode:S.mode+' '+S.n,gc:G.gc,ok:G.ok,tasks:G.tasks,rate,minutes:min,st:st.join('; '),wk:wk.join('; '),note:$('#nt').value.slice(0,300)};
  ST.hist.unshift(r);ST.hist=ST.hist.slice(0,500);save();
  if(ST.hook){try{fetch(ST.hook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(r)}).catch(()=>{})}catch(e){}}};
 $('#sv').onclick=()=>{fin();start()};$('#sw').onclick=()=>{fin();home()}
}
home();
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak & Roll — Mini Casino Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#11111F;--sf:#241B3D;--sf2:#2f2352;--gold:#E9BC53;--neon:#B66BFF;--tx:#f3eefc;--mut:#a79cc4;--ok:#5ee6a0;--bad:#ff7a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(1000px 500px at 50% -10%,#3a1f66,var(--bg));color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.big{font-family:Bungee,Inter,sans-serif;font-weight:400;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;color:var(--tx);background:var(--sf2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pl{background:var(--neon);color:#16072b;font-weight:800;box-shadow:0 0 14px #b66bff88}
.host{background:var(--gold);color:#2a1d00;font-weight:800;box-shadow:0 0 14px #e9bc5366}
.btn-l{padding:14px 28px;font-size:1.1rem}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:1px solid #4a3a7a;border-radius:16px;padding:18px}
.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.mut{color:var(--mut)}.gold{color:var(--gold)}.neon{color:var(--neon)}
input[type=text],textarea{width:100%;background:#17102c;border:1px solid #4a3a7a;color:var(--tx);border-radius:10px;padding:10px;font:inherit}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.on{background:var(--gold);color:#2a1d00;font-weight:800}
.title{font-size:clamp(2rem,6vw,3.6rem);color:var(--gold);text-shadow:0 0 24px #e9bc5388;text-align:center}
.sub{text-align:center;letter-spacing:.3em;color:var(--neon);font-weight:800}
.world{cursor:pointer;text-align:left;padding:14px;border:2px solid transparent;background:var(--sf)}
.world.on{border-color:var(--gold);box-shadow:0 0 18px #e9bc5355}
.bar{height:6px;border-radius:4px;background:#17102c;margin-top:8px}.bar i{display:block;height:100%;border-radius:4px;background:var(--neon)}
/* board */
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
.stat{background:var(--sf);border-radius:12px;padding:6px 12px;font-weight:800}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,minmax(70px,1fr));gap:6px}
.tile{border-radius:10px;padding:4px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid #ffffff22;position:relative;font-weight:600}
.tile b{font-size:1.2rem;line-height:1}.tile small{opacity:.6;position:absolute;top:2px;left:5px;font-size:.6rem}
.tQ{background:#3a2a73}.tD{background:#1f4a6b}.tC{background:#6b2a5e}.tM{background:#4a2a8a}.tT{background:#6b5412}.tJ{background:#7a3b10}
.tile.cur{outline:3px solid var(--gold);box-shadow:0 0 18px var(--gold);z-index:2}
.pawn{position:absolute;bottom:-4px;right:-2px;font-size:1.5rem;filter:drop-shadow(0 0 6px var(--neon))}
.center{grid-column:2/8;grid-row:2/6;background:var(--sf);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;text-align:center}
.dice{width:84px;height:84px;background:#fff;border-radius:16px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;box-shadow:0 0 22px var(--neon)}
.dice i{border-radius:50%;margin:auto;width:14px;height:14px;background:transparent}.dice i.p{background:#1b1030}
.dice.roll{animation:shake .12s infinite}@keyframes shake{25%{transform:rotate(-12deg) translateY(-4px)}75%{transform:rotate(12deg) translateY(4px)}}
.log{font-size:.8rem;color:var(--mut);max-height:64px;overflow:auto;width:100%}
.buffs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.buffs span{background:#3a2a73;border-radius:20px;padding:2px 10px;font-size:.75rem}
/* modal */
.ov{position:fixed;inset:0;background:#05020ccc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;overflow:auto}
.modal{background:var(--sf);border:2px solid var(--neon);border-radius:20px;padding:22px;max-width:640px;width:100%;box-shadow:0 0 40px #b66bff66;animation:flip .5s}
.modal.hostm{border-color:var(--gold);box-shadow:0 0 40px #e9bc5355}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}}
.prompt{font-size:1.35rem;font-weight:800;margin:10px 0}
.chip{display:inline-block;background:#3a2a73;border-radius:20px;padding:3px 12px;margin:3px;font-size:.85rem}
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bets button{padding:14px 6px;text-align:center}.bets b{display:block;font-size:1.8rem;font-family:Bungee}
.timer{font:2.4rem Bungee;color:var(--gold);text-align:center}.timer.low{color:var(--bad)}
.hint{background:#17102c;border-left:3px solid var(--neon);padding:8px 12px;margin:6px 0;border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.wheel{width:200px;height:200px;border-radius:50%;margin:10px auto;border:6px solid var(--gold);background:conic-gradient(#b66bff 0 60deg,#e9bc53 0 120deg,#5ee6a0 0 180deg,#ff7a8a 0 240deg,#4aa8ff 0 300deg,#f08a3c 0 360deg);transition:transform 3s cubic-bezier(.1,.7,.1,1);position:relative}
.wheel:after{content:"▼";position:absolute;top:-26px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:1.6rem}
.coin{position:fixed;font-size:1.6rem;z-index:30;pointer-events:none;animation:fly 1s forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
.jp{animation:jp 1s 3}@keyframes jp{50%{box-shadow:0 0 120px 40px var(--gold)}}
.crit{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center;font-size:.85rem}.crit button{padding:3px 10px}.crit .s{background:var(--ok);color:#06241a}.crit .w{background:var(--bad);color:#2a0710}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #4a3a7a;text-align:left;font-size:.85rem}
@media(max-width:700px){.board{grid-template-rows:repeat(6,minmax(54px,1fr));gap:3px}.tile{font-size:.58rem}.bets b{font-size:1.3rem}}
</style></head><body><div class="wrap" id="app"></div><div id="mod"></div>
<script>
const WORLDS=[{"id":"career","name":"Career Casino","icon":"💼","desc":"Jobs, interviews and success","tracks":[{"id":7,"t":"Advantages of a job interview","lv":"B1+","d":"1FDAwEJ-8tcm_UJjQF81LI1yixGBCJmEB","a2":{"p":"Talk about what you should do in a job interview. What information should you tell the interviewer about yourself?","h":[["Opening","When I am hunting for a job, I think a job interview is very important."],["Body","In the interview, I can talk to the interviewer in person. I should tell them about my educational background and my working experience."],["Body","I want to impress the interviewer by showing my ability and confidence. I also want to ask about the wage, the working conditions, and chances to get promotion to see if the job is suitable for me."],["Conclusion","I think a job interview is a great chance to find a good job."]]},"b1":{"p":"Why is a job interview beneficial for both the employer (interviewer) and the job seeker (interviewee)? How can an applicant make the best of a job interview?","h":[["Opening","Nowadays, when people are hunting for a job, a job interview plays a crucial role because it will do good to both the interviewer and the interviewee."],["Body","By means of an interview, the interviewee can gather essential information about the job, such as the wage, working conditions, and chances to get promotion. This helps them evaluate whether the position is truly suitable for them. Moreover, speaking in person is a golden opportunity to impress the company with their educational background, working experience, and confidence."],["Body","On the other hand, the interviewer can assess the candidate's real ability and personality to figure out whether they are the right fit for the company culture and position."],["Body","To make the best of a job interview, applicants should prepare carefully, research the company beforehand, and communicate clearly during the conversation."],["Conclusion","In conclusion, a job interview is a win-win process if both parties engage actively and professionally."]]},"v":[["Job interview","Buổi phỏng vấn xin việc"],["Interviewer","Người phỏng vấn (nhà tuyển dụng)"],["Interviewee","Người được phỏng vấn (ứng viên)"],["Wage","Mức lương, tiền công"],["Working conditions","Điều kiện làm việc"],["Chance to get promotion","Cơ hội thăng tiến"],["Educational background","Trình độ/Nền tảng học vấn"],["Working experience","Kinh nghiệm làm việc"]],"s":["Then, the interviewee can decide whether the job is really suitable for him.","He can tell the interviewer in person about his educational background or his working experience.","Thus, the interviewer can figure out whether he is the right person for the job.","In addition, the job interview will do good to both the interviewer and the interviewee."]},{"id":8,"t":"Career selection","lv":"B1+","d":"12rMMpKPuzusO35dthRkuinUc4eOAxv-v","a2":{"p":"Talk about a job you want to do in the future (or a job a friend/family member wants to do). What course do you need to study for this job?","h":[["Opening","I have made up my mind about my future career. I want to become a civil engineer / software developer / teacher."],["Body","When I finish school, I intend to take a general course at university. After that, I will take a special course on... to learn more skills."],["Body","I choose this job because I want to make roads, bridges, or work with water supply. I know some jobs have a hard life, but I really enjoy this work."],["Conclusion","After I finish my education, I hope I can go abroad or take a job with good opportunities."]]},"b1":{"p":"When choosing a career, some people want to work in their home country, while others intend to go abroad. Discuss the advantages and challenges of taking a job abroad, especially in developing or underdeveloped countries.","h":[["Opening","When people make up their mind about their career, working abroad is often an exciting option. Many specialists, such as mechanical engineers or experts in water supply, intend to go abroad after finishing their education."],["Body","Firstly, there are a lot of opportunities to gain practical experience when you take a job abroad. Working in underdeveloped countries allows engineers to build vital infrastructure like roads, bridges, and clean water systems, which makes a huge difference to local communities."],["Body","On the other hand, professionals may face a hard life away from home. They have to adapt to new cultures, language barriers, and sometimes difficult living conditions in underdeveloped areas."],["Conclusion","In conclusion, taking a job overseas requires good preparation. Completing both a general course and a special course will give young professionals the confidence to succeed anywhere in the world."]]},"v":[["Career","Sự nghiệp, nghề nghiệp"],["Mechanical engineer","Kỹ sư cơ khí"],["Civil engineering","Ngành kỹ thuật dân dụng / xây dựng"],["Water supply","Việc/Hệ thống cấp nước"],["Opportunity","Cơ hội"],["Underdeveloped country","Quốc gia chậm phát triển"],["Make up one's mind","Quyết định (đã đưa ra lựa chọn)"],["Take a course","Tham gia một khóa học"]],"s":["Black, he's made up his mind to be an engineer.","A mechanical engineer like my husband?","Of course, Patrick is very interested in cars too.","But he isn't going to make them."]},{"id":9,"t":"Choosing careers","lv":"B1+","d":"1i1piZoQdCLpZg6Mlps0B-9vmpZy7gK_8","a2":{"p":"Do you think parents should choose careers for their children, or should children choose by themselves? Do you usually consult your parents when making big decisions?","h":[["Opening","In my opinion, children should be left free to choose their own jobs because every job needs to suit the person who does it."],["Body","Parents and children may not share the same interest. A job that appeals to parents can be boring for children. Also, young people want to cultivate a spirit of independence."],["Body","However, parents always care about our well-being. They want us to have good economic benefit. So, it is wise to consult our parents before making a final decision."],["Conclusion","In short, I think mutual understanding between parents and children is the best way to choose a career."]]},"b1":{"p":"Many parents want their children to go in for prestigious professions, while young people desire independence in choosing their future jobs. Discuss both sides and explain why 'mutual understanding' is important in resolving this issue.","h":[["Opening","Choosing a future job often leads to disagreement between generations. While many parents insist that their children should follow their advice, young people prefer to make their own decisions."],["Body","On the one hand, parents’ choices reflect their deep concern for their children's well-being. They often want their children to go in for high- status professions that bring prestige and stable economic benefit. Some even hope their children will take over the family business."],["Body","On the other hand, children today are brought up in a different era and need to cultivate a spirit of independence and self-reliance. A career that appeals to parents might not suit the child's passion if they do not share the same interest."],["Body","Therefore, mutual understanding is the key. Parents should give their children the freedom to decide, while children should actively consult their parents to gain valuable wisdom from their experience."],["Conclusion","In conclusion, combining parental advice with personal passion will lead to the most successful career path."]]},"v":[["Profession","Nghề nghiệp (cần chuyên môn cao)"],["Prestige","Uy tín, thế lực, sự danh giá"],["Economic benefit","Lợi ích kinh tế (thu nhập tốt)"],["Spirit of independence","Tinh thần tự lập"],["Self-reliance","Sự tự lực, không phụ thuộc"],["Mutual understanding","Sự thấu hiểu lẫn nhau"],["Well-being","Mức độ hạnh phúc, sự bình an"],["Go in for","Theo đuổi, chọn (ngành/nghề)"]],"s":["For one thing, parents and children may not share the same interest.","A job that appeals to parents is likely to be boring for their children.","In short, children should be free to make their own decisions as to future careers.","In my opinion, in this case, as in many other things, Mutual understanding is important."]},{"id":10,"t":"The successful interview","lv":"B1+","d":"14jSsM9MJYrwO_bbhQchsiYxk1Jwdw5pN","a2":{"p":"What should a job seeker do to make a good first impression in an interview? What clothes should they wear and how should they talk?","h":[["Opening","To succeed in an interview, every job applicant needs to make a good lasting impression."],["Body","First, a job seeker should care about their personal appearance. They should be well-groomed and modestly dressed. They shouldn't wear clothes that are too casual."],["Body","Second, they must pay attention to their manner of speaking. It should be straightforward and friendly. Finally, they need to show self- confidence and enthusiasm for work."],["Conclusion","If a candidate displays these characteristics, they will easily get the job."]]},"b1":{"p":"In a job interview, what key qualities make an applicant stand out to the interviewer? Discuss the importance of personal appearance, communication style, and professional knowledge.","h":[["Opening","A successful job interview depends on many factors. To stand out, a job applicant must show both personal and professional qualities that create a lasting impression on the interviewer."],["Body","Firstly, personal appearance matters significantly. An impressive applicant should appear well-groomed and modestly dressed, avoiding clothes that are either overly elaborate or too casual."],["Body","Secondly, the applicant must pay attention to their manner of speaking, which ought to be straightforward, clear, and respectful. Moreover, they must be prepared to talk knowledgeably about the position, connecting the job requirements to their own professional experience."],["Body","Finally, interviewers value candidates who can convey a sense of self-confidence and genuine enthusiasm for work."],["Conclusion","In conclusion, a job seeker who displays these characteristics consistently will have a very high chance of winning over the employer."]]},"v":[["Job applicant / Job seeker","/dʒɒb ˈæplɪkənt/ / /dʒɒb ˈsiːkə(r)/"],["Lasting impression","Ấn tượng sâu sắc, khó phai"],["Personal appearance","Diện mạo cá nhân, vẻ bề ngoài"],["Manner of speaking","Cách nói chuyện, phong thái giao tiếp"],["Professional experience","Kinh nghiệm chuyên môn"],["Self-confidence","Sự tự tin"],["Enthusiasm for work","Sự nhiệt huyết / hào hứng với công việc"],["Pay attention to","Chú ý đến"]],"s":["To be successful in a job interview, the applicant should show certain personal and professional qualities."]},{"id":23,"t":"It's never too late for success","lv":"B1+","d":"1aH2reHDnOjTj9Lt5nAp8XZe-amhXaifs","a2":{"p":"Do you think young people should worry if they do not know what career to choose yet? What should teenagers do to prepare for their future success?","h":[["Opening","I believe that it's never too late for success, so young people should not worry too much during their formative years."],["Body","Many teenagers are given to daydreaming and do not show promise of a specific job yet. They sometimes despair of the future because they fear they will amount to nothing."],["Body","However, teenagers have the advantage of time. They should avail themselves of their free time and exert themselves to study hard and work persistently."],["Conclusion","In short, once young people find a great passion, they can easily reach their goals in the future."]]},"b1":{"p":"Some parents believe that a person must show talent early in life to be successful. To what extent do you agree with this view, and how can late bloomers achieve the peak of their career?","h":[["Opening","I disagree with the idea that showing early talent is required, because history proves that it's never too late for success."],["Body","During their formative years, many teenagers are given to uncertainty and show no early signs of greatness. When parents fear their children will amount to nothing, teenagers often despair of their future. However, famous figures like Mozart or Edison did not show clear success early on."],["Body","Late bloomers can reach the peak of their career as soon as they become fired with a great passion. To achieve this, they must learn to avail themselves of time, exert themselves fully, and work persistently toward their goals."],["Conclusion","In conclusion, time and persistent effort are far more valuable than early talent in determining long-term success."]]},"v":[["Formative years","Những năm tháng hình thành nhân cách / phát triển"],["Peak of one's career","Đỉnh cao sự nghiệp"],["Great passion","Niềm đam mê lớn"],["Amount to nothing","Không làm nên trò trống gì / Chẳng đạt thành công"],["Be given to (sth/V-ing)","/bi ˈɡɪvn tuː/"],["Show promise of","Hứa hẹn / Cho thấy triển vọng trở thành"],["Despair of","Tuyệt vọng về"],["Become fired with","Bùng cháy / Tràn đầy (nhiệt huyết, đam mê)"]],"s":["Therefore, it's never too late for success.","Teenagers, however disappointing and disappointed, have that one special advantage over the greatest men-alive time."]},{"id":28,"t":"DIFFERENT PURPOSES OF WORKING","lv":"B1+","d":"1nralbcckGzuU13FkIhHJUfAaIKF_hf6N","a2":{"p":"Do you think working or studying too much is good or bad? How do you keep a balance between work/study and personal life?","h":[["Opening","Working hard is good, but becoming a workaholic can make your life out of balance."],["Body","When people become obsessed with their work, they easily let other areas of life slide, like family, health, or hobbies."],["Body","To maintain balance, we must strive to avoid working all day. In my free time, I like to relax with friends so that I don't feel stressed."],["Conclusion","In short, a balanced life makes us happier and more creative in the long run."]]},"b1":{"p":"What is the difference between working to advance one's career and working for a noble cause? How can individuals avoid losing their identity to work?","h":[["Opening","People have different purposes for working; some focus on how to advance their career, while others work to support a noble cause or drive social transformation."],["Body","Some people spend too much time on organizational politics to collect symbols of success. If they lose their job, they easily lose their identity because their work defines who they are."],["Body","On the other hand, even those who work for meaningful goals can become addicted to or obsessed with their projects, causing their personal life to fall out of balance and letting other areas of life slide. Therefore, everyone should strive to avoid this pitfall."],["Conclusion","In conclusion, understanding the true purpose of work helps us maintain personal identity and lead a whole, fulfilled life."]]},"v":[["Organizational politics","Chính trị công sở / Thủ thuật nơi công sở"],["Symbols of success","Các biểu tượng của sự thành công"],["Noble cause","Mục tiêu cao đẹp / Sứ mệnh cao cả"],["Social transformation","Sự biến đổi / Thay đổi xã hội"],["Advance one's career","Thăng tiến trong sự nghiệp"],["Lose one's identity","Đánh mất bản sắc / Đánh mất chính mình"],["Become addicted to","Bị nghiện / Trở nên đam mê quá mức"],["Become obsessed with","Bị ám ảnh / Quá chìm đắm vào"]],"s":["His life is seriously out of balance.","This particular disease is called careerism.","Workaholics may or may not be careerists.","They may not even identify with their jobs."]}]},{"id":"health","name":"Health & Fortune","icon":"🍎","desc":"Food, exercise and healthy habits","tracks":[{"id":14,"t":"Physical exercise","lv":"B1+","d":"1eykJVXit0o2KFVEaWI6YxyYSTjcqNusp","a2":{"p":"What physical exercise or sports do you usually do to keep healthy? How often do you exercise, and do you prefer exercising alone or with others?","h":[["Opening","Nowadays, I realize the importance of regular physical exercise to keep my body healthy."],["Body","There are many exercises to suit different tastes. I prefer running in the morning / playing badminton. I try to do this on a regular basis."],["Body","I like playing competitive sports with friends who share my interest. / I prefer exercising alone in the park near my workplace."],["Conclusion","Doing exercise helps improve my health so I can feel energetic throughout my life."]]},"b1":{"p":"Compared to the past when work involved physical labor, why is physical exercise essential in modern life? How should different age groups choose suitable exercises so they do not do more harm than good?","h":[["Opening","In the past, people's daily work involved physical labor in the fields. Today, most people work in offices or factories, sitting all day. Therefore, more people realize the importance of regular physical exercise."],["Body","Different exercises exist to suit different tastes. Young people may enjoy competitive sports like tennis or football alongside friends who share their interest. On the other hand, older adults may prefer traditional practices like taijiquan or qigong in parks or near their workplace."],["Body","However, exercise must be chosen carefully. Older people should avoid overly intense activities that might do them more harm than good. Even spending a small amount of time running or walking daily can provide them with sufficient movement."],["Conclusion","In conclusion, choosing the right form of activity and keeping it regular will effectively improve health throughout one's life."]]},"v":[["Physical exercise","Bài tập thể dục / Hoạt động thể chất"],["Physical labor","Lao động chân tay"],["Competitive sport","Môn thể thao có tính cạnh tranh / đối kháng"],["Workplace","Nơi làm việc"],["Realize the importance of","Nhận ra tầm quan trọng của"],["Provide (sb) with (st)","Cung cấp cho ai cái gì"],["Suit different tastes","Phù hợp với nhiều sở thích / gu khác nhau"],["Share an interest","Có cùng sở thích"]],"s":["Their daily lives do not provide them with the exercise their bodies need.","To keep healthy, therefore, they must spend part of their free time doing regular physical exercise.","There are many different forms of physical exercise to suit different tastes.","Some people enjoy competitive sports and play with others who share their interest."]},{"id":17,"t":"Health is more important than wealth","lv":"B1","d":"1FkNdoe99TbABUamZ5_XEyCnJ4QiI1ZdV","a2":{"p":"Why is health important to you? What daily habits do you have to stay healthy and avoid getting sick?","h":[["Opening","I agree that health is more important than wealth. In other words, without good health, I cannot study or work effectively."],["Body","To maintain my health, I try to keep good hours by sleeping early and waking up early. I also exercise every day to stay strong."],["Body","I always remember that prevention is better than cure, so I pay close attention to my meals and hygiene to avoid getting sick."],["Conclusion","Having good habits helps me stay energetic and makes my dreams come true."]]},"b1":{"p":"Do you agree with the statement: 'Health is the foundation of one's future success'? Explain how good health helps people overcome obstacles in their career and life.","h":[["Opening","I strongly believe that health is the foundation of future success. It is the most vital component of success for anyone."],["Body","If people become sick, it is almost impossible to pursue a career effectively, much less achieve great goals. Conversely, when we are physically and mentally fit, we can go all out to overcome obstacles that lie ahead."],["Body","To sustain energy, we should keep good hours and pay close attention to our lifestyle. A healthy routine will do wonders for our outlook on life. Furthermore, applying the principle 'prevention is better than cure' ensures long-term well-being."],["Conclusion","In conclusion, wealth without health is meaningless. Protecting our body is the first step to turning ambitions into reality."]]},"v":[["Proverb","Tục ngữ, ngạn ngữ"],["Foundation of","Nền tảng của..."],["Outlook on life","Quan điểm / Góc nhìn về cuộc sống"],["Component of success","Yếu tố / Thành tố của thành công"],["Pursue a career","Theo đuổi sự nghiệp"],["Make dreams come true","Biến ước mơ thành hiện thực"],["Go all out","Dốc hết sức, nỗ lực tối đa"],["Overcome obstacles","Vượt qua rào cản, trở ngại"]],"s":["What should we do to maintain our health?","First, we should exercise every day to strengthen our muscles.","Second, we might as well keep good hours.","If we get up early, we can breathe fresh air and see the sunrise."]},{"id":19,"t":"Having breakfast or not","lv":"B1+","d":"1-KbGASSw5q84xwYTehGOnKfmErQmcLGe","a2":{"p":"Do you usually eat breakfast or go without breakfast in the morning? Do you feel guilt when you omit breakfast?","h":[["Opening","Since I was young, I was brought up to believe that breakfast is one of life's essentials."],["Body","Sometimes I feel guilt about skipping this meal because I worry it will affect my performance at school/work."],["Conclusion","In short, I try my best to eat breakfast every day to keep my body healthy."]]},"b1":{"p":"Many people were brought up to believe that breakfast is the most important meal of the day. Do you think omitting breakfast negatively affects a person's performance, or is it acceptable for adults to skip it?","h":[["Opening","Most of us were brought up to consider breakfast as one of life's essentials. However, modern research suggests that omitting breakfast might not be as harmful as we once thought."],["Body","Traditionally, people believed that going without breakfast would badly affect performance during the day. However, any scientific evidence directly linking breakfast to better working capacity in adults is surprisingly inadequate. Many adults simply do not feel hungry in the morning."],["Body","For many adults, eating early in the morning is by no means an enjoyable experience. Therefore, they should not feel guilt about skipping breakfast if their energy levels remain high throughout the day. A professor of nutrition might even agree that listening to your own body is more important than forcing yourself to eat."],["Conclusion","In conclusion, while children need breakfast for development, adults can choose whether to eat or skip breakfast based on their personal health and lifestyle demands."]]},"v":[["Life's essentials","Những điều/yếu tố thiết yếu trong cuộc sống"],["Scientific evidence","Bằng chứng khoa học"],["Professor of nutrition","Giáo sư dinh dưỡng"],["Be brought up to (do sth)","Được nuôi dạy / giáo dục để làm gì"],["Omit breakfast","Bỏ bữa sáng"],["Go without breakfast","Nhịn / Không ăn sáng"],["Affect performance","Ảnh hưởng đến hiệu suất (học tập/làm việc)"],["Link (A) to (B)","Gắn kết / Liên kết cái gì với cái gì"]],"s":["So despite all the efforts, they still take no breakfast.","Ernesto Pollitt at the University of Texas, is poor."]},{"id":20,"t":"Smoking","lv":"B1+","d":"1WsveTrrL1rBd7woM-7uWyGXhgdjN3ZCH","a2":{"p":"Why is smoking dangerous for young people, and what health risks can regular smokers suffer from?","h":[["Opening","Smoking is very dangerous, and even young children can suffer from severe health problems if they smoke."],["Body","A regular smoker can suffer lung damage and breathing disorders. Even a little exercise can bring on breathlessness."],["Body","Many young people have ignorance of these dangers because they do not believe health warnings apply to them."],["Conclusion","In short, we need to teach children early about all health risks of smoking."]]},"b1":{"p":"Although adult smoking has decreased, the number of young smokers remains constant. Why do many teenagers ignore health warnings, and how can health education be improved to prevent youth smoking?","h":[["Opening","Recent research carried out in schools shows that while adult smoking is going down, the number of underage smokers remains constant."],["Body","In the past, reports mainly concentrated on adults, leading to teenagers' ignorance of non-cancer risks. Most young students feel invincible and do not believe that health warnings apply to them, even when they start to suffer from breathing disorders or lung damage."],["Body","To solve this, health education must start early, even at primary school. Schools should show students how smoking as a regular smoker quickly brings on breathlessness and damages their daily physical performance."],["Conclusion","In conclusion, educating children early about specific health risks will help protect the younger generation from long-term damage."]]},"v":[["Lung damage","Tổn thương phổi"],["Breathing disorder","Rối loạn hô hấp"],["Health warning","Cảnh báo sức khỏe"],["Health risk","Rủi ro về sức khỏe"],["Ignorance of (sth)","Sự thiếu hiểu biết / không biết về"],["Carry out research / a survey","/ˈkæri aʊt/"],["Concentrate on","Tập trung vào"],["Bring on (breathlessness)","Gây ra / Dẫn đến (chứng khó thở)"]],"s":["The number of adults has gone down steadily but the number of children smoking remained constant.","This is mainly because children find it hard to believe that health warnings apply to them.","The research was carried out in 13 Hounslow secondary schools.","Analysis showed 15% of regular smokers coughed every day."]},{"id":29,"t":"The Killer - Smoking","lv":"B1","d":"1Xaj_AcxIMRyAiRnvFbjkM0pfU9bk3rOq","a2":{"p":"Why is smoking harmful to your health, and what should people do to live a healthy life without smoking?","h":[["Opening","Smoking is very dangerous because it can destroy a person's health and make them struggle to breathe or walk."],["Body","Many smokers are angry with themselves for starting this bad habit. They realize that they ruin it for themselves and waste their money on products from tobacco companies."],["Body","When seeing a sick smoker, people are often shocked by the damage caused by cigarettes. To live better, we should exercise, eat healthy food, and stay away from smoking."],["Conclusion","In short, saying no to smoking is the best way to protect our future."]]},"b1":{"p":"Despite knowing the fatal risks of smoking, many people still smoke and tobacco companies continue to promote their products. How can anti-smoking campaigns effectively convince young people not to smoke?","h":[["Opening","Smoking can cause severe health problems like inoperable tumors, forcing patients to go through painful radiation treatment."],["Body","It is frustrating when some cigarette executives have the gall to deny the clear dangers of smoking. Many victims are angry with these tobacco companies because their products ruin lives and leave victims distorted with pain."],["Body","To warn the public, anti-smoking campaigns should have real pictures of victims blown up on billboards so people are shocked by the real impact. When young people see patients struggling to perform basic daily tasks, they will think twice before choosing to ruin it for themselves."],["Conclusion","In conclusion, strong visual warnings and strict laws against tobacco promotion are key to protecting public health."]]},"v":[["Radiation treatment","Đợt xạ trị / Việc điều trị bằng tia xạ"],["Tobacco companies","Các công ty / tập đoàn thuốc lá"],["Cigarette executives","Các giám đốc / nhà điều hành công ty thuốc lá"],["Ruin (sth) for oneself","Tự tàn phá / Tự làm hỏng (cuộc sống/sức khỏe) của mình"],["Have the gall to (do sth)","Có sự trơ tráo / Cả gan làm gì"],["Be angry with (sb) for (V-ing)","Tức giận với ai vì đã làm gì"],["Struggle to (do sth)","Chật vật / Khó khăn làm gì"],["Have (sth) blown up","Cho phóng to (hình ảnh, bức ảnh)"]],"s":["It's less than a hundred meters away, but I had to sit down halfway there.","The birds were singing, and the smell of honeysuckle filled the air.","I'm angry with myself for smoking, but I'm also angry with the tobacco companies.","Today, when I look in the mirror, I am shocked by what I see."]},{"id":32,"t":"Vitamins","lv":"B1+","d":"15zi_X8SW9UYuzQKQNxbJij4w5QhHvmDl","a2":{"p":"Why are vitamins important for our bodies, and what foods do you eat to stay healthy?","h":[["Opening","As is known to all, vitamins are essential to our daily health and growth."],["Body","If we are short of vitamins, our resistance to disease will be lowered accordingly, and we may easily lose our appetite."],["Body","Vitamins A, B, and C are chiefly contained in fresh fruit, vegetables, milk, and meat. Eating these foods helps us grow well."],["Conclusion","In short, I always try to eat healthy food every day to protect my body."]]},"b1":{"p":"Many people suffer from health issues due to an unbalanced diet. Discuss the specific roles of vitamins in human health and suggest how people can maintain a nutritious diet.","h":[["Opening","As is known to all, vitamins are essential to human survival, although the necessary daily intake varies considerably from person to person."],["Body","Different vitamins have distinct roles. For instance, Vitamin B plays the role of a catalyst in the digestion of food, while Vitamin C is vital for the formation of bones and blood vessels. If a person is short of these nutrients, their resistance to disease will be lowered accordingly, causing them to lose their appetite or suffer from weak growth."],["Body","To stay healthy, individuals should combine foods chiefly contained in natural ingredients like green vegetables, fruits, and meat rather than depending on fast food."],["Conclusion","In conclusion, understanding proper nutrition allows us to build better eating habits and maintain long-term physical well-being."]]},"v":[["Resistance to disease","Sức đề kháng với bệnh tật"],["Digestion of food","Sự tiêu hóa thức ăn"],["Formation of (teeth/bones)","/fɔːˈmeɪʃn əv/"],["Be essential to","Rất quan trọng / Cần thiết đối với"],["Be short of","Thiếu hụt (dinh dưỡng, tiền bạc...)"],["Lose one's appetite","Mất cảm giác thèm ăn / Bỏ ăn"],["Play the role of a catalyst","Đóng vai trò làm chất xúc tác"],["As is known to all","Như mọi người đều biết"]],"s":["Vitamin A comes mainly from milk, butter, cheese, fish, and green vegetables.","Vitamin B is chiefly contained in bread, meat, milk, liver, and potatoes.","It can play the role of a catalyst in digestion of food.","Vitamin C generally exists in fruit, potatoes, and green vegetables."]},{"id":33,"t":"Food and Health","lv":"B1+","d":"10AiUnfSqzK1EhhFwN27YPrVWOWifJRAh","a2":{"p":"Why do you think some foods are unfit to eat, and how can we choose healthy food for our daily meals?","h":[["Opening","The food we eat has profound effects on our body, but many processed products today are unfit to eat."],["Body","Many illnesses are related to bad eating habits and chemical food additives. Sometimes, farmers give drugs to livestock for financial reasons to fatten the animals."],["Body","People can be prone to contract diseases if they eat bad food. Therefore, we should choose fresh food that is fit to eat and safe for our health."],["Conclusion","In short, eating fresh and clean food is the best way to stay healthy every day."]]},"b1":{"p":"How do modern farming practices and chemical additives affect human health, and what measures should be taken to ensure food safety?","h":[["Opening","Modern food technology has profound effects on public health, yet many daily ingredients have become unfit to eat."],["Body","A large percentage of human diseases are related to diet. Food factories often use carcinogenic additives to preserve color or taste. Meanwhile, drugs are administered to animals not for medicinal purposes, but for financial reasons to fatten the animals quickly, making consumers more prone to contract serious illnesses."],["Body","To protect public health, governments must strictly limit harmful food additives and inspect farm procedures. Individuals should also return to traditional diets with natural ingredients that are characteristic in healthy cultures."],["Conclusion","In conclusion, prioritizing food safety over economic profits is crucial for a healthier society."]]},"v":[["Profound effects","Tác động / Ảnh hưởng sâu sắc"],["Food additives","Các chất phụ gia thực phẩm"],["Carcinogenic additives","Các chất phụ gia gây ung thư"],["Medicinal purposes","Mục đích y tế / chữa bệnh"],["Be related to","Có liên quan đến / Rút ra từ"],["Be prone to contract","Dễ bị / Có nguy cơ cao mắc (bệnh)"],["Preserve color","Bảo quản / Giữ màu sắc"],["Administer to","Cấp / Cho dùng (thuốc) cho"]],"s":["That food is related to illness is not a new discovery.","Sometimes similar drugs are administered to animals not for medicinal purposes, but for financial reasons."]}]},{"id":"school","name":"Learning Land","icon":"🎓","desc":"English, schools and teachers","tracks":[{"id":15,"t":"Why do these people learn English?","lv":"B1","d":"1K9cmNOFse6VRzDSHH54wMGa2OvcHJpMF","a2":{"p":"Why are you learning English? How do you practice English every day (at school, by yourself, or through films and music)?","h":[["Opening","I am learning English because it is a compulsory school subject and it is useful for my future career."],["Body","I study English at school, but I also study by myself at home. Sometimes I learn by hearing English in songs, television shows, and movies."],["Body","Learning a new language is not easy, so I need to work hard every day to improve my vocabulary and pronunciation."],["Conclusion","I hope my English will be good enough so I can use it for my higher studies and read magazines or books in English."]]},"b1":{"p":"Why do people of different age groups (children, teenagers, adults) learn English? In your opinion, is it possible to master English just by hearing it in daily life, or must learners work hard through formal study?","h":[["Opening","English is learned by millions of people worldwide, from young children and teenagers to adults, each with different goals."],["Body","For young students, English is a key school subject. Teenagers often need English for their higher studies because university textbooks and research papers are frequently published in English. Meanwhile, adults focus on English because it is useful for their work and career growth."],["Body","Some people are lucky enough to learn by hearing English naturally through films, TV shows, or working in international offices. However, for most learners, simply listening is not enough. They must study by themselves or work hard through structured courses to master grammar, writing, and formal communication."],["Conclusion","In conclusion, while natural exposure helps, a combination of natural hearing and hard work is the most effective way to master English."]]},"v":[["Teenager","Thanh thiếu niên (13-19 tuổi)"],["Adult","Người trưởng thành / Người lớn"],["Higher studies","Việc học ở bậc cao hơn (Cao đẳng/Đại học)"],["School subject","Môn học ở trường"],["Study by oneself","Tự học"],["Learn by hearing","Học bằng cách nghe (thụ động)"],["Work hard","Học tập/Làm việc chăm chỉ"],["Be lucky enough to (do sth)","Đủ may mắn để làm gì"]],"s":["Most people must work hard to learn English.","Why do all these people learn English?","It's not difficult to answer this question.","Many boys and girls learn English at school because it is one of their subjects."]},{"id":21,"t":"The Education Of TV Children","lv":"B1+","d":"1L2yJ_UpiDU7qlWu51ACldON5xPQnmSCM","a2":{"p":"Would you like to act in TV shows as a child actor, or do you prefer going to a regular school? Why?","h":[["Opening","I prefer going to a regular school rather than working as a child actor. / I would love to act in TV shows because it sounds exciting."],["Body","Either way, students are required to study hard and get good marks to have a bright future."],["Conclusion","In short, going to a regular school is the best choice for my daily life."]]},"b1":{"p":"Child actors cannot attend regular schools due to their work schedules. What are the benefits and challenges of this lifestyle, and how can adults protect these young workers?","h":[["Opening","Young pupils who act in TV shows cannot attend a regular school, making their education a special kind of work."],["Body","On the one hand, child actors have unique opportunities. Their classes are held in unusual locations like spaceships or boats. Private teachers give lessons directly on set, helping them balance fame along with basic knowledge."],["Body","On the other hand, balancing work and study is stressful. Teachers must be responsible for ensuring that children work only within permitted hours and cover all required subjects. Furthermore, if they fail to get good marks, they are not permitted to continue acting."],["Conclusion","In conclusion, strict laws and dedicated teachers are necessary to protect young talents and ensure they receive a complete education while pursuing their dreams."]]},"v":[["Regular school","Trường học chính quy / bình thường"],["Child actor","Diễn viên nhí"],["Permitted hours","Số giờ làm việc được cho phép"],["Required subjects","Các môn học bắt buộc"],["Act in TV shows","Đóng phim / diễn xuất trên chương trình TV"],["Give lessons","Giảng dạy / Cho bài học"],["Be responsible for (V-ing/sth)","/bi rɪˈspɒnsəbl fə(r)/"],["Be required to (do sth)","Được yêu cầu / Bắt buộc phải làm gì"]],"s":["The teacher's job is very important.","She makes sure, too, that the child gets enough rest and play along with his education.","Child actors are required to attend classes 20 hours each week.","California law says that they must be taught from September to the middle of June."]},{"id":22,"t":"Learning English","lv":"B1+","d":"1gW54q4IeSvq-b8ZVDJCrmMscgdAWBIJC","a2":{"p":"How do you practice English in your spare time, and what skills do you want to improve?","h":[["Opening","English is the most widely used language, so I am determined to study it well."],["Body","In my spare time, I often listen to English songs or watch TV shows. I try to pay attention to pronunciation and try to grasp the main idea instead of translating every word."],["Body","I also read simple books to improve my reading comprehension. Even when I make mistakes in writing or speaking, I am not discouraged."],["Conclusion","I believe that the more I practice, the more confident I will become."]]},"b1":{"p":"Many learners spend too much time memorizing grammatical rules instead of practicing communication. How can English learners overcome the fear of making mistakes and effectively improve their skills?","h":[["Opening","As English is a widely used language, focusing solely on grammatical rules is not enough to achieve fluency."],["Body","To enhance reading comprehension, learners should go through articles smoothly to grasp the main idea rather than stopping at every difficult word. For listening, spending spare time on authentic materials helps us pay attention to natural speech patterns. As the saying goes, the more you practice, the more natural it becomes."],["Body","Many learners are afraid to speak or write because they might make mistakes. However, they should not be discouraged by errors. Instead, if they are determined to communicate, every mistake becomes a valuable lesson."],["Conclusion","In conclusion, shifting focus from perfect grammar to practical usage is the key to mastering English successfully."]]},"v":[["Grammatical rules","Các quy tắc ngữ pháp"],["Reading comprehension","Khả năng đọc hiểu"],["Spare time","Thời gian rảnh rỗi"],["Pay attention to","Chú ý / Tập trung vào"],["Grasp the main idea","Nắm bắt ý chính"],["Go through","Đọc qua / Đọc lướt"],["Make mistakes","Mắc lỗi / Phạm sai lầm"],["Be determined to (do sth)","Quyết tâm làm gì"]],"s":["I try my best to grasp the main idea.","Reading is an important step in learning English well.","I read textbooks and other reading materials.","When I am free, I often read English magazines and newspapers."]},{"id":25,"t":"TOEFL","lv":"B1+","d":"1AhvD9Kaho3hkyqirt2MgwMhStcovSqwf","a2":{"p":"Why do many students take English tests like TOEFL, and why is it important to practice speaking and writing in English?","h":[["Opening","TOEFL is a short way of saying Test of English as a Foreign Language. Many students take this test because they plan to study abroad."],["Body","These tests help measure a person's ability in English. To do well, students must practice both spoken English and written English."],["Body","Learning to organize information and express ideas clearly is very helpful. Without good English, studying in a new country can be extremely difficult."],["Conclusion","In short, practicing English every day helps students prepare well for their future studies."]]},"b1":{"p":"Many foreign students struggle when studying abroad because they underestimate the amount of writing and speaking required in class. How can preparing for standardized English tests help students succeed in university?","h":[["Opening","When students plan to attend a graduate school abroad, proving their proficiency in a foreign language is essential."],["Body","At university, foreign students are expected to speak up in class discussions and write lengthy essays. If their spoken English and written English are not strong enough, their academic journey will become extremely difficult."],["Body","Tests like TOEFL accurately measure a person's ability to academic standards. Preparing for examinations that involve speaking and writing forces students to learn how to organize information logically and express ideas precisely."],["Conclusion","In conclusion, mastering these core skills early helps international students adapt quickly and succeed in foreign universities."]]},"v":[["Foreign language","Ngoại ngữ"],["Graduate school","Trường cao học / Chương trình sau đại học"],["Spoken English","Tiếng Anh nói / Kỹ năng nói tiếng Anh"],["Written English","Tiếng Anh viết / Kỹ năng viết tiếng Anh"],["Measure a person's ability","Đo lường / Đánh giá năng lực của một người"],["Involve (V-ing/sth)","/ɪnˈvɒlv/"],["Organize information","Sắp xếp / Tổ chức thông tin"],["Express ideas","Diễn đạt ý tưởng"]],"s":["TOEFL does not measure how well you speak English, however.","The Test of Spoken English does.","It is about a 20-minute test that involves speaking English.","Some universities also will tell you to take yet another test, the Test of Written English."]},{"id":26,"t":"American Education","lv":"B1+","d":"1UD0iOFZf-LOl37mffsDeL4wpEhNrh-Md","a2":{"p":"What subjects do you learn at school, and why should students give their own opinions during lessons instead of sitting with their hands folded?","h":[["Opening","At school, we learn many basic subjects like the three R's (reading, writing, arithmetic) and social studies."],["Body","In class, students should not just sit with hands folded and keep quiet. Instead, they need to ask questions and give their own opinions."],["Body","Speaking up helps us learn to think for oneself and develop our abilities and interests. It is necessary for students to practice this every day for their growth and development."],["Conclusion","In short, an active classroom makes learning much more interesting and helpful."]]},"b1":{"p":"Modern education is based on encouraging students to think for themselves and make their own judgment. How does this approach benefit students' future development compared to traditional learning?","h":[["Opening","A good educational system is based on the idea that children must learn to be independent rather than just memorizing facts."],["Body","A newcomer to modern schools will notice that students do not simply sit with hands folded. Beyond learning the three R's or social studies, they are encouraged to give their own opinions and make their own judgment."],["Body","Encouraging children to think for oneself helps them develop their abilities and interests effectively. During events like an open school week, parents can clearly see how it is necessary for young people to apply book knowledge into real-life growth and development."],["Conclusion","In conclusion, teaching students how to think rather than what to think is the most valuable gift education can provide."]]},"v":[["The three R's","Ba kỹ năng cơ bản (Đọc, Viết, Làm toán)"],["Social studies","Môn học về xã hội (Lịch sử, Chính trị/Chính phủ)"],["Growth and development","Sự trưởng thành và phát triển"],["Open school week","Tuần lễ mở cửa trường học (dành cho phụ huynh tham quan)"],["Be based on","Dựa trên / Dựa vào"],["Think for oneself","Tự suy nghĩ / Tư duy độc lập"],["Make one's own judgment","Tự đưa ra đánh giá / nhận định"],["Give one's own opinions","Bày tỏ / Nêu ý kiến riêng"]],"s":["The school should be the place where they learn to do this.","In schools, children learn the three R's, reading, writing, and arithmetic.","They study history and government, which are often called social studies, and many other subjects.","She knows that what the children learn from books is important."]},{"id":30,"t":"American Education System","lv":"B1+","d":"1JA5soxQ3WNqicFfgVQbQhhcd7hjQldQv","a2":{"p":"Do you go to a public or private school, and do you think students should work while studying at university?","h":[["Opening","I am studying at a public elementary school (or high school), so my parents do not have to pay directly for my fees."],["Body","In my country, students must stay in school until high school. After that, many high school graduates choose to go to college."],["Body","Studying at a state university is affordable, but many students still work while studying. It is a good way to earn money for their college expenses."],["Conclusion","In short, working part-time helps students become more independent for their future."]]},"b1":{"p":"Should the government use tax money to support higher education for all students, or should students work while studying to pay for their own expenses?","h":[["Opening","When high school graduates enter higher education, managing college expenses becomes a major challenge for many families."],["Body","On one hand, institutions like a state university that receive tax money from the government allow parents not to pay directly for exorbitant tuition fees. This ensures that every student can afford to stay in school and pursue higher degrees."],["Body","On the other hand, if students decide to attend a private school or university, fees are higher. Many choose to work while studying so they can earn money for their living costs, which teaches them responsibility and real-world skills."],["Conclusion","In conclusion, a balance between government subsidies and student self-reliance provides the most sustainable path for higher education."]]},"v":[["Public elementary school","Trường tiểu học công lập"],["Tax money","Tiền thuế (ngân sách nhà nước)"],["High school graduates","Học sinh tốt nghiệp trung học phổ thông"],["College expenses","Chi phí học đại học"],["Stay in school","Duy trì việc học / Tiếp tục đến trường"],["Attend a private school","Theo học trường tư thục"],["Receive tax money from","Nhận tiền thuế hỗ trợ từ (chính phủ)"],["Earn money for","Kiếm tiền chi trả cho"]],"s":["Most students are 17 or 18 years old when they leave secondary school.","Another name for secondary school is high school.","Most children go to public elementary and secondary schools.","If a child attends a private school, his parents pay for the child's education."]},{"id":42,"t":"A Good Teacher or Not?","lv":"B1+","d":"11dVHs2gYOcRSVkdY141jy68j61GI_8OQ","a2":{"p":"Describe a memorable teacher you had in school. Was this teacher strict or easygoing, and how did they help you?","h":[["Opening","I remember one high school teacher in particular because she was very strict but dedicated."],["Body","I remember vividly how she demanded discipline from every student. She gave us a heavy homework load every week and checked our work carefully."],["Body","She always emphasized practice over talking. In other words, she wanted us to work hard, and her lessons really benefited me in my studies."],["Conclusion","In short, a strict teacher can help us form good study habits for the future."]]},"b1":{"p":"Some students prefer friendly, lenient teachers, while others believe strict discipline produces better academic results. Discuss the qualities of an effective teacher and how strictness influences student learning.","h":[["Opening","What defines a great educator is many things to many people, as some value kindness while others appreciate strictness."],["Body","Teachers who demand discipline and maintain a high homework load help students build strong work ethics. I remember vividly a strict teacher who emphasized self-study and effort. In other words, setting high standards encourages students to push beyond their limits."],["Body","Although students may feel stressed initially when teachers demand strict compliance, as time goes by, they realize that these rigorous methods greatly benefit their personal growth and future career."],["Conclusion","In conclusion, a balance between strict expectations and genuine care creates the most effective learning environment."]]},"v":[["Discipline","Kỷ luật / Tính nguyên tắc"],["Homework load","Khối lượng bài tập về nhà"],["Demand (sth) from (sb)","Đòi hỏi / Yêu cầu cao ở ai"],["Remember vividly","Nhớ như in / Nhớ rất rõ"],["Emphasize","Nhấn mạnh / Coi trọng"],["Benefit (sb)","Mang lại lợi ích / Giúp ích cho ai"],["Be many things to many people","Có nhiều vai trò / Ý nghĩa khác nhau đối với mỗi người"],["In particular","Nói riêng / Cụ thể"]],"s":["I think she was a good teacher because she was a very strict person.","I remember very vividly a sign over her classroom door.","She prepared her work very carefully and demanded us to do the same.","We got lots of homework from her."]}]},{"id":"life","name":"City of Dreams","icon":"🏙️","desc":"Family, dreams and life choices","tracks":[{"id":6,"t":"Dreams","lv":"B1","d":"1bleuFO632q-S2AXNwonA2XDbuLKpQyPD","a2":{"p":"Talk about your dreams when you sleep. Do you usually remember your dreams when you wake up? What do you usually dream about?","h":[["Opening","According to science, everyone dreams every night. When I am asleep, my mind creates a series of mind pictures."],["Body","Personally, I think I seldom remember my dreams when I wake up. Sometimes, I only remember a little bit."],["Body","My dreams are influenced by my day. For example, if I watch a scary movie, or if I have worries about exams, I dream about scary things. If I am cold, I might dream of a snowstorm!"],["Conclusion","I like dreaming because in my dreams, I can see my wishes come true and feel successful."]]},"b1":{"p":"Why do you think humans need to dream every night? How do our daily feelings, environment, and desires influence the content of our dreams?","h":[["Opening","Studies of human sleep have shown that dreaming is a natural and necessary part of our lives. A dream is made up of different mind pictures that form while we are asleep."],["Body","Firstly, the content of a dream is heavily influenced by physical environment and emotions. When we sleep, we have little or no control over our minds. Therefore, if someone feels cold, they might dream of a snowstorm. Similarly, worries or anger from daily life can shape what we dream about."],["Body","Secondly, scientists believe dreaming serves a vital purpose. One famous theory is that dreaming allows us to escape from the rules of our real world. In real life, we face limits, but in dreams, we can see our wishes come true. We have the chance to feel rich, powerful, and successful."],["Conclusion","In conclusion, even though some people claim they seldom dream (simply because they forget when they wake up), dreaming plays a crucial role in helping us refresh our minds and process our deepest emotions."]]},"v":[["Mind picture","Hình ảnh trong tâm trí/tiềm thức"],["Snowstorm","Cơn bão tuyết"],["Study of human sleep","Nghiên cứu về giấc ngủ con người"],["Theory","Thuyết, giả thuyết"],["Rules of the real world","Quy tắc/quy luật của thế giới thực"],["Be made up of","Được tạo thành bởi, bao gồm"],["Have little/no control over","/hæv ˈlɪtl / nəʊ kənˈtrəʊl ˈəʊvə(r)/"],["Be influenced by","Chịu ảnh hưởng bởi"]],"s":["Then, ideas and feelings come out to form the mind picture known as dreams.","Dreams may be influenced by different things that are present during sleep.","If a person is cold, he may dream that he is out in a snowstorm.","Worries or anger may also influence the content of a dream."]},{"id":11,"t":"My family","lv":"A2","d":"1kvM0ONjOwQRFS6KP-2PutVgLDYWqYqSh","a2":{"p":"Talk about your family members and your position in your family (e.g. eldest, middle, or youngest child). How do you help each other at home?","h":[["Opening","There are [4/5/6] people in my family. I am the eldest child / middle kid / youngest child."],["Body","My eldest brother is a junior at university. He always has his nose in a book. My sister is a senior in high school and she is a whiz at math, so she often helps me with my homework."],["Body","Everyone is busy, but we all help with the housework. My sister is good at cooking and cleaning. Sometimes, as the youngest, I get pushed around a little bit, but I cannot complain too much."],["Conclusion","I really love my family and I am very proud of them."]]},"b1":{"p":"Discuss the pros and cons of your position in your family (being the eldest, middle, youngest, or an only child). How do your family members support each other's studies and personal growth?","h":[["Opening","Being the middle kid (or eldest/youngest) in a family comes with both advantages and disadvantages, but it shapes who we are today."],["Body","On the one hand, being in the middle means you sometimes feel squeezed between siblings. You might get pushed around by older brothers who are already a freshman or junior in college, while you are not allowed to boss your younger siblings. However, I cannot complain too much because it teaches you flexibility and patience."],["Body","On the other hand, having siblings is a huge advantage for academic and personal growth. For instance, if you want to be a chemistry major or improve your grades, you can ask an older sibling who is a whiz at science or math. Meanwhile, everyone contributes by doing housework and being quiet when someone is studying and shouldn't make the slightest noise."],["Conclusion","In conclusion, despite small daily conflicts, I am extremely proud of my family because we always support one another's ambitions."]]},"v":[["Middle kid / child","/ˈmɪdl kɪd/"],["Eldest brother","Anh cả"],["Freshman","Sinh viên năm nhất"],["Junior","Sinh viên năm ba"],["Senior","Học sinh/Sinh viên năm cuối"],["Whiz at (sth)","Người cực giỏi / \"Thần đồng\" về cái gì"],["Chemistry major","Sinh viên chuyên ngành Hóa học"],["Housework","Việc nhà"]],"s":["We all try to help with the housework.","Chang Han is my eldest brother.","He is a junior in a university now.","He is going to be a medical doctor."]},{"id":12,"t":"Where is happiness from?","lv":"B1+","d":"1_M9EvL8TVyaExguglGrU2JO_8bWFdm0K","a2":{"p":"What does true happiness mean to you? Is happiness just having fun, or do we need to work hard and overcome difficulties?","h":[["Opening","Many people hold to the belief that having a pain-free life is happiness, but I think true happiness is different."],["Body","Having fun is great, but more often than not, real joy comes from effort. For example, working hard for self-improvement or professional achievement takes time, but it makes us proud."],["Body","Also, helping our family or making a commitment to a relationship might be difficult inevitably, but it brings deep happiness."],["Conclusion","In short, knowing that true happiness requires effort is a liberating realization that helps me avoid envy when I see others having fun on social media."]]},"b1":{"p":"Many people confuse short-term pleasure with long-term happiness. How do commitments, hard work, and inevitable pain contribute to attaining real happiness in life?","h":[["Opening","In modern society, many people hold to the belief that a fun-filled, pain-free life equals happiness. However, to attain real happiness, we must understand that meaningful experiences often involve struggle."],["Body","When people try to avoid the attempts that cause discomfort, they miss out on deeper satisfaction. For instance, a bachelor may enjoy a single life full of freedom, but if he hesitates to make a commitment due to fear of responsibility, he may lack deep connection in the long run."],["Body","More often than not, significant milestones such as professional achievement, self-improvement, or raising a family inevitably bring challenges. Yet, these struggles are the core distinguishing features of a fulfilling life."],["Body","Accepting this truth is a liberating realization. It liberates us from envy because we realize that those who constantly show off a fun lifestyle might not actually be happy inside."],["Conclusion","In conclusion, true happiness is not about avoiding pain, but about finding meaning through hard work and responsibility."]]},"v":[["Pain-free life","Cuộc sống không có đau khổ / khó khăn"],["Professional achievement","Thành tựu nghề nghiệp / sự nghiệp"],["Self-improvement","Sự tự hoàn thiện / phát triển bản thân"],["Bachelor","Người đàn ông độc thân"],["Distinguishing feature","Đặc điểm nhận dạng / nét đặc trưng"],["Liberating realization","Sự nhận thức mang lại cảm giác giải thoát / khai sáng"],["Envy","Sự đố kỵ, ghen tị"],["Hold to the belief (that)","Tin rằng, giữ niềm tin rằng"]],"s":["If he is honest, he will tell you that he is afraid of making a commitment.","For commitment is, in fact, quite painful.","The single life is filled with fun, adventure, and excitement.","Marriage has such moments, but they are not its most distinguishing features."]},{"id":35,"t":"Mother's Love","lv":"A2","d":"1gV2o4COMGo5eyDEYiNXBzyOX_JQnu-rq","a2":{"p":"How does your mother show love to you, and what do you do to make her happy?","h":[["Opening","A mother's love is a selfless love, and my mother always protects me as much as she could."],["Body","Whenever I am sick or tired, she stops her work to attend to me. She wakes up at the least noise and gives her whole heart to taking care of our family."],["Body","To make her happy, I try to study hard so she doesn't feel sorry for me in case I have problems at school. When I cook for her, I treat her as if she were a queen."],["Conclusion","In short, I love my mother very much and want to be a good child."]]},"b1":{"p":"Parental devotion is often quiet and unconditional. Discuss how mothers show their devotion to children throughout their growth and how young people should appreciate these sacrifices.","h":[["Opening","True maternal affection is defined by selfless love, where a mother gives her whole heart to ensuring her children's well-being."],["Body","During a child's early waking hours, a mother works tirelessly and wakes up at the least stir to attend to her baby. As children grow up and move away, she prepares meals as if they were honored guests, sometimes secretly shedding tears for their departure in case they feel lonely."],["Body","Knowing that mothers feel sorry for our difficulties even more than we do, young people should express gratitude through actions. We must try our best as much as we could to achieve our goals and spend quality time with our parents."],["Conclusion","In conclusion, appreciating a mother's silent sacrifices helps strengthen family bonds and shapes us into responsible individuals."]]},"v":[["Selfless love","Tình yêu vị tha / Không vị kỷ"],["Waking hours","Lúc thức / Thời gian tỉnh táo"],["Attend to (sb)","Chăm sóc / Chăm nom ai"],["Give one's whole heart to","Dành trọn trái tim / Tâm trí cho"],["Feel sorry for","Thương xót / Đau lòng cho"],["Shed tears for","Rơi nước mắt vì ai / cái gì"],["As much as (sb) could","Hết sức có thể / Nhiều nhất có thể"],["The least noise / stir","/ðə liːst noɪz / stɜː(r)/"]],"s":["In your waking hours, she held you in her arms.","Whenever you made the least noise, she stopped her work to attend to you.","Sometimes, when she slept at night, the least stir on your part would awake her.","She gave her whole heart to you."]},{"id":39,"t":"A woman at home","lv":"B1+","d":"15gHzSr5C1385mkfT46ugNCPcTU2S7bkl","a2":{"p":"Do women in your country usually go to work or stay at home, and what challenges do working mothers face?","h":[["Opening","Nowadays, many women do not just accept a traditional role at home; they also go to work to help make a living."],["Body","Working mothers often have two jobs. Besides their office work, they have a round-the-clock job taking care of children and cooking at home."],["Body","Sometimes, women still have to settle for lower salaries than men for the same job."],["Conclusion","Although there is still a long way to go, families should share housework to support working women."]]},"b1":{"p":"How has the role of women in society changed over time, and what measures are needed to achieve full gender equality in the workplace?","h":[["Opening","Thanks to the women's liberation movement, the social status of women has changed significantly compared to their traditional role in the past."],["Body","Previously, many high-level jobs were reserved for men, and most professional fields were heavily dominated by men. As a result, female workers had few chances for advancement, had to settle for lower income, and still handled round-the-clock domestic responsibilities."],["Body","To support gender equality, companies and governments must actively eliminate sex discrimination in hiring and promotions, ensuring fair compensation for everyone regardless of gender."],["Conclusion","In conclusion, while there is still a long way to go to achieve total equality, continued effort will create a fairer and more prosperous society."]]},"v":[["Traditional role","Vai trò truyền thống"],["Chances for advancement","Cơ hội thăng tiến"],["Sex discrimination","Sự phân biệt đối xử theo giới tính"],["Women's liberation movement","Phong trào giải phóng phụ nữ"],["Make a living","Kiếm sống / Trang trải cuộc sống"],["Settle for","Đành chấp nhận / Cam chịu"],["Be dominated by","Bị chi phối / Chiếm đa số bởi"],["Eliminate","Xóa bỏ / Loại bỏ"]],"s":["But until recently, few have had real careers."]},{"id":40,"t":"Making decisions","lv":"B1","d":"1ls62XcBq8Nf9eB7d-dpBrvKjEuDmt-Gy","a2":{"p":"Do you find it easy or difficult to make decisions quickly, and how do your parents help you make choices?","h":[["Opening","It is amusing to see how people choose things; some can come to a decision right away, while I often ponder for a long time."],["Body","When I go shopping, I like to buy clothes of my own liking. My parents allow me to choose things on my own, but I still consult them when I am not sure."],["Body","Learning to decide on things by myself gives me a great deal of responsibility and helps me grow up."],["Conclusion","In short, making decisions on my own helps me become a more independent person."]]},"b1":{"p":"Some people can make decisions right away, while others ponder for a long time. Discuss why decision-making skills differ among people and how parents can encourage children to become independent decision-makers.","h":[["Opening","It is amusing to observe how differently people handle choices; while some reach a decision right away, others ponder endlessly before picking an option."],["Body","Decision-making ability is shaped early in childhood. When parents allow children to select clothes of their own liking and handle tasks on their own, it gives them a great deal of responsibility. In a way, overprotected children who rarely decide on things by themselves often struggle to choose independently later in life."],["Body","Parents should guide rather than dictate. Children should feel free to consult their parents for advice, but still be given the autonomy to make final choices."],["Conclusion","In conclusion, fostering early independence equips individuals with the confidence to make firm decisions throughout their lives. A. TARGET VOCABULARY 1. Danh từ & Cụm danh từ (Nouns & Noun Phrases) ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- STT Từ / Cụm từ Phiên âm (IPA) Nghĩa tiếng Việt Ví dụ trong bài ----- -------------------------------- ------------------------------------ ------------------------------------- ------------------------------------------------------------------- 1 A great deal of responsibility /ə ɡreɪt diːl əv rɪˌspɒnsəˈbɪləti/ Trách nhiệm lớn / Ý thức tự lập cao ...given them a great deal of responsibility at a very young age. 2 Clothes of one's own liking /kləʊðz əv wʌnz əʊn ˈlaɪkɪŋ/ Quần áo theo sở thích riêng ...allows them to choose clothes of their own liking... ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- 2. Động từ & Cụm động từ (Verbs & Verb Phrases) -------------------------------------------------------------------------------------------------------------------------------------------------------------------- STT Từ / Cụm từ Phiên âm (IPA) Nghĩa tiếng Việt Ví dụ trong bài ----- ---------------------------- ---------------------------- ----------------------------------- ---------------------------------------------------------------- 3 Come to / Reach a decision /kʌm tu / riːtʃ ə dɪˈsɪʒn/ Đi đến / Đạt được quyết định ...some of my friends who can come to a decision right away... 4 Ponder /ˈpɒndə(r)/ Suy ngẫm / Trăn trở / Cân nhắc kỹ The others will ponder and look at the thing... 5 Decide on (sth) /dɪˈsaɪd ɒn/ Quyết định chọn cái gì ...many times they are able to decide on something... 6 Consult (sb) /kənˈsʌlt/ Hỏi ý kiến / Tham khảo ý kiến ai Of course, they consult her sometimes... -------------------------------------------------------------------------------------------------------------------------------------------------------------------- 3. Tính từ, Cụm từ & Cấu trúc khác (Adjectives, Phrases & Structures) --------------------------------------------------------------------------------------------------------------------------------------------------------------------------- STT Từ / Cụm từ Phiên âm (IPA) Nghĩa tiếng Việt Ví dụ trong bài ----- --------------------------- ---------------------- ------------------------------------------- ---------------------------------------------------------------------- 7 Right away /raɪt əˈweɪ/ Ngay lập tức ...who can come to a decision right away... 8 On one's own /ɒn wʌnz əʊn/ Tự mình / Bằng chính sức mình She has allowed them to make decisions on their own. 9 It is amusing to (do sth) /ɪt ɪz əˈmjuːzɪŋ tu/ Thật thú vị / Buồn cười khi (làm gì) It is amusing to watch some of my friends... 10 In a way /ɪn ə weɪ/ Theo một cách nào đó / Ở khía cạnh nào đó ...and I think in a way that teaches a great deal of responsibility. --------------------------------------------------------------------------------------------------------------------------------------------------------------------------- B. SPEAKING PROMPTS & HINTS 1. Đề bài dành cho trình độ A2 (Cơ bản - Thói quen Đưa ra Quyết định & Sự Tự lập) Đề bài (Prompt): \"Do you find it easy or difficult to make decisions quickly, and how do your parents help you make choices?\" (Bạn thấy dễ hay khó khi đưa ra quyết định nhanh chóng, và bố mẹ giúp bạn đưa ra lựa chọn như thế nào?) Gợi ý cấu trúc bài nói (Speaking Hints):"],["Opening","It is amusing to see how people choose things; some can come to a decision right away, while I often ponder for a long time."],["Body","When I go shopping, I like to buy clothes of my own liking. My parents allow me to choose things on my own, but I still consult them when I am not sure."],["Body","Learning to decide on things by myself gives me a great deal of responsibility and helps me grow up."],["Conclusion","In short, making decisions on my own helps me become a more independent person."]]},"v":[["A great deal of responsibility","Trách nhiệm lớn / Ý thức tự lập cao"],["Clothes of one's own liking","Quần áo theo sở thích riêng"],["Come to / Reach a decision","/kʌm tu / riːtʃ ə dɪˈsɪʒn/"],["Ponder","Suy ngẫm / Trăn trở / Cân nhắc kỹ"],["Decide on (sth)","Quyết định chọn cái gì"],["Consult (sb)","Hỏi ý kiến / Tham khảo ý kiến ai"],["Right away","Ngay lập tức"],["On one's own","Tự mình / Bằng chính sức mình"]],"s":["She has allowed them to make decisions on their own."]},{"id":41,"t":"Birth, marriage and death","lv":"B1","d":"1zucy6fdRg8G5EjBvRjRDed5V2QDdsfNt","a2":{"p":"What is an important event in a person's life in your country, and how do people celebrate it?","h":[["Opening","In my country, getting married is a major event that is always marked by a special ceremony."],["Body","Marriage is definitely a time of joy. The bride and groom go through a traditional wedding where guests give them gifts to help them set up their home."],["Body","Unlike birth, we have a choice in whether or not we get married and when to celebrate it with family."],["Conclusion","In short, life events connect family members and bring happiness to everyone."]]},"b1":{"p":"Birth, marriage, and death are major milestones in every human culture. Discuss how these events are celebrated in different societies and why ceremonies are important to people.","h":[["Opening","All human societies, from the most primitive to the most sophisticated, are affected by birth, marriage, and death."],["Body","Although the ways people celebrate differ around the world, all cultures share common characteristics. Birth and marriage are always a time of joy, where parents receive gifts on behalf of newborns, and newlyweds are given support to set up their home. Conversely, death is a time of sorrow marked by solemn mourning."],["Body","While we have no control over birth or death, humans have a choice in whether or not to marry. Going through these special ceremonies helps individuals transition into new life stages and reinforces community support."],["Conclusion","In conclusion, rituals surrounding life's major milestones remind us of our shared humanity and social values."]]},"v":[["Special ceremony","Nghi lễ / Lễ kỷ niệm đặc biệt"],["On behalf of","Thay mặt cho / Đại diện cho"],["A time of joy / sorrow","/ə taɪm əv dʒɔɪ / ˈsɒrəʊ/"],["Be marked by","Được đánh dấu / Kỷ niệm bởi"],["Have a choice in","Có sự lựa chọn trong việc gì"],["Be affected by","Bị ảnh hưởng / Tác động bởi"],["Share common characteristics","Có / Chia sẻ những đặc điểm chung"],["Go through","Trải qua / Thực hiện (nghi lễ, quá trình)"]],"s":["But we have no choice in birth and death.","Birth is a time of joy.","The proud parents receive congratulations and presents on behalf of the newborn.","Marriage is also a time of joy."]}]},{"id":"planet","name":"Travel & Planet","icon":"🌏","desc":"Places, nature and journeys","tracks":[{"id":16,"t":"Noise pollution","lv":"B1+","d":"1bsFChWNDoJqLjO2TIF1lT_Xjn_J6Nh4D","a2":{"p":"Is your city or neighborhood noisy? How does loud noise affect your daily life and sleep, and how do you find quiet time?","h":[["Opening","I live in a big city where noise afflicts daily life. It is a manifest fact that my neighborhood is very noisy."],["Body","Vehicles and bustling crowds make nerve-wracking noise. This noise easily diverts my attention when I study and disturbs my sleep at night, making me feel fidgety and tired."],["Body","To relax, I try to enjoy some tranquil leisure time early in the morning at dawn or late at night when everything is quiet."],["Conclusion","In short, I hope people will think twice before making unnecessary loud noise in public spaces."]]},"b1":{"p":"Noise pollution is n
